# Standalone workspace: this scratch bench must not join the product workspace.
[workspace]

[package]
name = "fanout-bench"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
name = "fanout_bench"

[dependencies]
napi = { version = "2", features = ["async", "tokio_rt"] }
napi-derive = "2"
bytes = "1"
dashmap = "6"
once_cell = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
