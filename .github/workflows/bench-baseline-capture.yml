name: benchmark baseline capture

on:
  workflow_call:
    inputs:
      approver:
        description: Authenticated GitHub login approving the measured baseline
        required: true
        type: string
  workflow_dispatch:
    inputs:
      approver:
        description: Authenticated GitHub login approving the measured baseline
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-baseline-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture governed Ubuntu benchmark baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BENCH_MACHINE_IDENTITY: github-actions-ubuntu-latest-x64
      BENCH_BASELINE_APPROVER: ${{ github.actor }}
      WEBTRANSPORT_SUPPRESS_INSECURE_SKIP_VERIFY_WARN: "1"
    steps:
      - name: Authenticate approver input
        env:
          INPUT_APPROVER: ${{ inputs.approver }}
          AUTHENTICATED_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          test -n "$INPUT_APPROVER" || {
            echo "::error::approver input is required"
            exit 1
          }
          test "$INPUT_APPROVER" = "$AUTHENTICATED_ACTOR" || {
            echo "::error::approver must equal authenticated github.actor"
            exit 1
          }
          echo "Authenticated benchmark approver: $AUTHENTICATED_ACTOR"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Build native addon
        run: bun run build:native
      - name: Capture proposed approved baseline
        run: bun run bench:capture
      - name: Upload immutable capture and proposed baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 resolved 2026-07-22
        with:
          name: benchmark-baseline-capture-${{ github.run_attempt }}
          path: |
            tools/bench/baselines/*.json
            tools/bench/approved-baselines.json
          if-no-files-found: error
          retention-days: 90
