# Release: build prebuilds for all targets, generate checksums, and create GitHub release.
# P3.2: Security gates block release on CRITICAL/HIGH findings.
name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    name: Security gates (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
      - name: Cargo audit (Rust dependencies)
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
          cargo audit --file crates/wasm/Cargo.lock
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@6c76e0e1ddee25de1a2a17c0ad09e028b20bb0d0 # v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Trivy vulnerability scan (libraries)
        uses: aquasecurity/trivy-action@6c76e0e1ddee25de1a2a17c0ad09e028b20bb0d0 # v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          scanners: vuln
          vuln-type: library
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "rust"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4c79b4e9ebfe577d446333c2e31ed81079e7b03 # v4 resolved 2026-07-22
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@e4c79b4e9ebfe577d446333c2e31ed81079e7b03 # v4 resolved 2026-07-22
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4c79b4e9ebfe577d446333c2e31ed81079e7b03 # v4 resolved 2026-07-22

  parity:
    name: Parity (W3C facade)
    needs: [security, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - name: Build native addon
        run: bun run build:native
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Parity tests
        run: bun run test:parity
      - name: Produce parity evidence
        run: |
          echo '{"suite":"parity","passed":true,"timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","ref":"'${{ github.ref_name }}'"}' > parity-evidence.json
      - name: Upload parity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 resolved 2026-07-22
        with:
          name: parity-evidence
          path: parity-evidence.json
          if-no-files-found: error
          retention-days: 90

  interop:
    name: Interop (Chromium)
    needs: [security, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - name: Build native addon
        run: bun run build:native
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Interop (Chromium)
        run: |
          cd tools/interop
          bun install
          bun run install:browsers
          bun run prepare:interop
          INTEROP_EVIDENCE=1 bun run playwright test
          bun run sanitize-evidence.ts interop-evidence.json
          bun run verify-evidence.ts interop-evidence.json
        timeout-minutes: 5
      - name: Upload interop evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 resolved 2026-07-22
        with:
          name: interop-evidence
          path: tools/interop/interop-evidence.json
          if-no-files-found: error
          retention-days: 90

  fuzz:
    name: Fuzz smoke (blocking)
    needs: [security, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install pinned fuzz tooling
        run: rustup run 1.95.0 cargo install cargo-fuzz --locked --version 0.13.1
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Release fuzz smoke
        run: bun run fuzz:release-smoke
      - name: Sanitize fuzz evidence
        run: bun run tools/interop/sanitize-evidence.ts .release-evidence/fuzz/release-smoke.json
      - name: Upload fuzz evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 resolved 2026-07-22
        with:
          name: fuzz-evidence
          path: |
            .release-evidence/fuzz/
            tools/fuzz/corpora/
          if-no-files-found: error
          retention-days: 90

  coverage:
    name: Coverage floors (blocking)
    needs: [security, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      WEBTRANSPORT_SUPPRESS_INSECURE_SKIP_VERIFY_WARN: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install coverage tooling
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Native coverage
        run: cargo llvm-cov --workspace --branch --json --output-path coverage/native-coverage.json
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 resolved 2026-07-22
        with:
          name: coverage-artifacts
          path: coverage/
          if-no-files-found: error
          retention-days: 90

  bench-regress:
    name: Benchmark regression (blocking)
    needs: [security, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      WEBTRANSPORT_SUPPRESS_INSECURE_SKIP_VERIFY_WARN: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - name: Build native addon
        run: bun run build:native
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Benchmark regression against the approved baseline
        run: bun run bench:regress
      - name: Upload benchmark regression evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 resolved 2026-07-22
        with:
          name: bench-regress-evidence
          path: .release-evidence/bench/
          if-no-files-found: error
          retention-days: 90

  distributed-scale:
    name: Distributed scale >=10k sessions (blocking)
    needs: [security, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      WEBTRANSPORT_SUPPRESS_INSECURE_SKIP_VERIFY_WARN: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - name: Build native addon
        run: bun run build:native
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Distributed scale campaign (>=10k sessions)
        run: bun tools/load/distributed-scale.ts
      - name: Sanitize distributed scale evidence
        run: |
          bun run tools/interop/sanitize-evidence.ts .release-evidence/load/distributed-scale-artifact.json
          bun run tools/interop/verify-evidence.ts .release-evidence/load/distributed-scale-artifact.json
      - name: Upload distributed scale evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 resolved 2026-07-22
        with:
          name: distributed-scale-evidence
          path: .release-evidence/load/
          if-no-files-found: error
          retention-days: 90

  build:
    needs: [security, codeql, fuzz]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            rust_target: ""
          - os: macos-latest
            target: darwin-arm64
            rust_target: ""
          - os: macos-latest
            target: darwin-x64
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            target: win32-x64-msvc
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - name: Build native addon (${{ matrix.target }})
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            rustup target add ${{ matrix.rust_target }}
            bunx @napi-rs/cli@3.3.0 build --cwd crates/native --platform --release --target ${{ matrix.rust_target }}
          else
            bun run build:native
          fi
      - name: Prebuild + checksums
        run: |
          cd packages/webtransport && bun run prebuild:native
          cd ../..
          bun scripts/write-sha256sums.ts packages/webtransport/prebuilds
      - name: Upload prebuilds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 resolved 2026-07-22
        with:
          name: prebuilds-${{ matrix.target }}
          path: packages/webtransport/prebuilds/*
          if-no-files-found: error
          retention-days: 30

  package-consumers:
    name: Exact package consumers (${{ matrix.os }} / Node ${{ matrix.node-version }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      WEBTRANSPORT_SUPPRESS_INSECURE_SKIP_VERIFY_WARN: "1"
      CC_wasm32_unknown_unknown: clang
      AR_wasm32_unknown_unknown: llvm-ar
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "18.20.4"
          - os: ubuntu-latest
            node-version: "20.19.0"
          - os: ubuntu-latest
            node-version: "22.23.1"
          - os: macos-latest
            node-version: "18.20.4"
          - os: macos-latest
            node-version: "20.19.0"
          - os: macos-latest
            node-version: "22.23.1"
          - os: windows-latest
            node-version: "18.20.4"
          - os: windows-latest
            node-version: "20.19.0"
          - os: windows-latest
            node-version: "22.23.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-07-22
        with:
          node-version: ${{ matrix.node-version }}
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: "2.9.3"
      - name: Install exact release tooling
        run: |
          npm install --global npm@11.18.0
          cargo install wasm-bindgen-cli --locked --version 0.2.121
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and smoke the exact tarball in every supported runtime
        run: |
          bun scripts/test-package-artifact.ts build \
            --prebuilds-dir prebuilds \
            --require-release-targets \
            --verify-reproducible \
            --runtime bun \
            --runtime node \
            --runtime deno

  release:
    needs:
      [
        build,
        interop,
        parity,
        coverage,
        bench-regress,
        distributed-scale,
        fuzz,
        package-consumers,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: interop-evidence
          path: interop-evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: parity-evidence
          path: parity-evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fuzz-evidence
          path: fuzz-evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-artifacts
          path: coverage-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bench-regress-evidence
          path: bench-regress-evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distributed-scale-evidence
          path: distributed-scale-evidence
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.9"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-07-22
        with:
          node-version: "22.23.1"
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: "2.9.3"
      - name: Install exact npm CLI
        run: npm install --global npm@11.18.0
      - name: Install exact wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked
      - name: Verify required evidence (CI-EVIDENCE-A)
        run: |
          find interop-evidence -name "interop-evidence.json" -type f | grep -q . || (echo "::error::Missing interop-evidence.json"; exit 1)
          find parity-evidence -name "parity-evidence.json" -type f | grep -q . || (echo "::error::Missing parity-evidence.json"; exit 1)
          find fuzz-evidence -name "release-smoke.json" -type f | grep -q . || (echo "::error::Missing fuzz release-smoke.json"; exit 1)
          find coverage-artifacts -name "native-coverage.json" -type f | grep -q . || (echo "::error::Missing native-coverage.json"; exit 1)
          find bench-regress-evidence -name "bench-regress-artifact.json" -type f | grep -q . || (echo "::error::Missing bench-regress-artifact.json"; exit 1)
          find distributed-scale-evidence -name "distributed-scale-artifact.json" -type f | grep -q . || (echo "::error::Missing distributed-scale-artifact.json"; exit 1)
      - name: Regenerate combined SHA256SUMS (all targets)
        run: |
          set -euo pipefail
          for binary in \
            webtransport-native.darwin-arm64.node \
            webtransport-native.darwin-x64.node \
            webtransport-native.linux-x64.node \
            webtransport-native.win32-x64-msvc.node; do
            test -f "prebuilds/$binary" || {
              echo "::error::Missing required release prebuild prebuilds/$binary"
              exit 1
            }
          done
          bun scripts/write-sha256sums.ts prebuilds
          cd prebuilds
          shasum -a 256 -c SHA256SUMS
      - name: Build and smoke the exact npm package tarball
        run: |
          bun install --frozen-lockfile
          bun scripts/test-package-artifact.ts build \
            --prebuilds-dir prebuilds \
            --require-release-targets \
            --verify-reproducible \
            --runtime bun \
            --runtime node \
            --runtime deno
      - name: Bind npm publish input to this immutable release run
        env:
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          CANDIDATE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || [[ ! "$RELEASE_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "::error::Release run identity is not numeric"
            exit 1
          fi
          if [[ ! "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release candidate commit or tag identity is invalid"
            exit 1
          fi
          mapfile -t TARBALLS < <(find packages/webtransport -maxdepth 1 -name '*.tgz' -type f -print)
          if [ "${#TARBALLS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one npm tarball, found ${#TARBALLS[@]}"
            exit 1
          fi
          TARBALL="${TARBALLS[0]}"
          TARBALL_NAME="$(basename "$TARBALL")"
          TARBALL_SHA256="$(shasum -a 256 "$TARBALL" | cut -d' ' -f1)"
          OUTPUT_DIR=".release-evidence/npm-publish-input"
          mkdir -p "$OUTPUT_DIR"
          cp "$TARBALL" "$OUTPUT_DIR/$TARBALL_NAME"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflowPath ".github/workflows/release.yml" \
            --argjson releaseRunId "$RELEASE_RUN_ID" \
            --argjson releaseRunAttempt "$RELEASE_RUN_ATTEMPT" \
            --arg candidateCommit "$CANDIDATE_COMMIT" \
            --arg tag "$RELEASE_TAG" \
            --arg tarball "$TARBALL_NAME" \
            --arg tarballSha256 "$TARBALL_SHA256" \
            '{schemaVersion: 1, repository: $repository, workflowPath: $workflowPath, releaseRunId: $releaseRunId, releaseRunAttempt: $releaseRunAttempt, candidateCommit: $candidateCommit, tag: $tag, tarball: $tarball, tarballSha256: $tarballSha256}' \
            > "$OUTPUT_DIR/candidate-identity.json"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson runId "$RELEASE_RUN_ID" \
            --argjson attempt "$RELEASE_RUN_ATTEMPT" \
            --arg commit "$CANDIDATE_COMMIT" \
            --arg tag "$RELEASE_TAG" \
            --arg tarball "$TARBALL_NAME" \
            --arg digest "$TARBALL_SHA256" \
            '.schemaVersion == 1 and .repository == $repository and .workflowPath == ".github/workflows/release.yml" and .releaseRunId == $runId and .releaseRunAttempt == $attempt and .candidateCommit == $commit and .tag == $tag and .tarball == $tarball and .tarballSha256 == $digest' \
            "$OUTPUT_DIR/candidate-identity.json" >/dev/null
          test "$(shasum -a 256 "$OUTPUT_DIR/$TARBALL_NAME" | cut -d' ' -f1)" = "$TARBALL_SHA256"
      - name: Upload immutable npm publish input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 resolved 2026-07-22
        with:
          name: npm-publish-input-${{ github.run_attempt }}
          path: .release-evidence/npm-publish-input/
          if-no-files-found: error
          retention-days: 90
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 resolved 2026-07-22
        with:
          files: |
