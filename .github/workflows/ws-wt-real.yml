# Real two-host WS↔WT comparison on the heavy self-hosted runner.
#
# Runs both echo servers and both measurement clients inside two Linux
# network namespaces (server + client) connected by a veth pair, with
# controllable netem on the link. This is the real-machine analog of
# the WS↔WT comparison — two processes on different network stacks,
# real routing, real kernel, real tc qdisc — not loopback.
#
# Trigger via workflow_dispatch. The runner_label `heavy` is the same
# pool that runs `bench-bandwidth` and `sink-gate`. The default ladder
# runs three netem steps (0ms, 25ms, 50ms) to make the WS/WT crossover
# visible; override with `netem_steps` to run a single condition.
name: ws-wt-real
on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: "Exact commit SHA to benchmark"
        required: true
        type: string
      netem_steps:
        description: "Comma-separated netem steps as delayMs,jitterMs pairs"
        required: false
        default: "0,0;25,5;50,10"
        type: string
      reps:
        description: "Reps per arm per scenario per netem step"
        required: false
        default: "3"
        type: string
      samples_per_rep:
        description: "Samples per rep per arm per scenario per netem step"
        required: false
        default: "50"
        type: string
      runner_label:
        description: "Self-hosted runner pool (heavy for the standard ladder)"
        required: false
        default: "heavy"
        type: choice
        options:
          - "heavy"
          - "soak"
jobs:
  ws-wt-real:
    permissions:
      contents: read
    runs-on: ${{ fromJson(github.event.inputs.runner_label == 'soak' && '["self-hosted","Linux","X64","soak"]' || '["self-hosted","Linux","X64","heavy"]') }}
    timeout-minutes: 90
    concurrency:
      group: ws-wt-real
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.candidate_commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-07-22
        with:
          node-version: "22.23.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Build native addon
        run: bun run build:native
      - name: Profile runner capacity
        run: |
          CPUS="$(nproc 2>/dev/null || echo 1)"
          MEM_KB="$(awk '/MemTotal/ {print $2}' /proc/meminfo 2>/dev/null || echo 0)"
          echo "Runner: cpu=$CPUS mem=$((MEM_KB / 1024))MB"
      - name: Run real two-host WS↔WT comparison
        env:
          WEBTRANSPORT_SUPPRESS_INSECURE_SKIP_VERIFY_WARN: "1"
          REPS: ${{ github.event.inputs.reps }}
          SAMPLES_PER_REP: ${{ github.event.inputs.samples_per_rep }}
        run: |
          set -euo pipefail
          mkdir -p .release-evidence/transport-comparison/ws-wt-r0/campaign-r0
          IFS=';' read -ra STEPS <<< "${{ github.event.inputs.netem_steps }}"
          for STEP in "${STEPS[@]}"; do
            IFS=',' read -r DELAY JITTER <<< "$STEP"
            DELAY="${DELAY:-0}"
            JITTER="${JITTER:-0}"
            TS="$(date -u +%Y%m%dT%H%M%SZ)"
            OUT_DIR=".release-evidence/transport-comparison/ws-wt-r0/campaign-r0/heavy-runner-${TS}-delay${DELAY}ms-jitter${JITTER}ms"
            echo "=== netem delay=${DELAY}ms jitter=${JITTER}ms out=${OUT_DIR} ==="
            NETEM_DELAY_MS="$DELAY" NETEM_JITTER_MS="$JITTER" \
              OUT_DIR="$OUT_DIR" \
              bash tools/compare/load/ws-wt-real.sh
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: ws-wt-real-${{ github.event.inputs.candidate_commit }}-${{ github.run_id }}
          path: |
            .release-evidence/transport-comparison/ws-wt-r0/campaign-r0/heavy-runner-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
