# One-shot diagnostic for the heavy runner: does quinn-udp's UDP_SEGMENT
# (GSO) probe succeed on this host, and what do the kernel/NIC offload
# features look like? Measurement only, no gate. Trigger via workflow_dispatch.
name: probe-gso
on:
  workflow_dispatch:

jobs:
  probe:
    permissions:
      contents: read
    runs-on: ["self-hosted", "Linux", "X64", "heavy"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
      - name: Host offload diagnostics
        run: |
          echo "== kernel =="
          uname -a
          echo "== primary interface =="
          IFACE="$(ip route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<NF;i++) if($i=="dev") print $(i+1)}' | head -1)"
          echo "iface=$IFACE"
          if command -v ethtool >/dev/null 2>&1 && [ -n "$IFACE" ]; then
            echo "== driver =="
            ethtool -i "$IFACE" || true
            echo "== offload features (udp/gso/gro) =="
            ethtool -k "$IFACE" | grep -Ei 'udp|gso|gro|segmentation' || true
          else
            echo "ethtool unavailable or iface not found; skipping feature dump"
          fi
      - name: Build and run quinn-udp probe
        run: cargo run --release -p reference --bin gso-probe
