# Re-verifies the committed release evidence record against the candidate
# pre-release: every asset is downloaded and hashed, the tag must still point
# at the candidate, producing runs are re-read, and once promoted the release
# must still match the promotion lock. A pre-release must not be edited after
# promotion; this job is how an edit is noticed.
name: release-evidence-verify
on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - docs/release-evidence-manifest.json
      - docs/release-status.json
      - docs/release-claims.json
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: release-evidence-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release evidence record
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Verify the bound candidate (and the promotion lock once ready)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(jq -r '.candidate.commit' docs/release-evidence-manifest.json)" = "null" ]; then
            echo "No candidate is bound; nothing to verify."
            exit 0
          fi
          if [ "$(jq -r '.candidate.readiness' docs/release-status.json)" = "ready" ]; then
            bun scripts/release-evidence.ts verify --require-ready
          else
            bun scripts/release-evidence.ts verify --integrity-only
          fi
