name: fuzz
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions: {}

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: nightly-2026-07-31
          components: llvm-tools-preview
      - name: Install LLVM symbolizer
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm
          symbolizer="$(command -v llvm-symbolizer || find /usr/lib/llvm-*/bin -type f -name llvm-symbolizer -print -quit)"
          test -n "$symbolizer"
          echo "$(dirname "$symbolizer")" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install pinned fuzz tooling
        run: rustup run 1.95.0 cargo install cargo-fuzz --locked --version 0.13.1
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Compile-check fuzz targets (PR-time safety net)
        run: |
          rustup run nightly-2026-07-31 cargo fuzz build --fuzz-dir tools/fuzz --sanitizer address || \
          (cd tools/fuzz && rustup run 1.95.0 cargo check --all-targets)
      - name: Scheduled fuzz smoke
        run: bun run fuzz:release-smoke
      - name: Sanitize fuzz evidence
        run: bun run tools/interop/sanitize-evidence.ts .release-evidence/fuzz/release-smoke.json
      - name: Upload fuzz evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 resolved 2026-07-22
        with:
          name: fuzz-evidence
          path: |
            .release-evidence/fuzz/
            tools/fuzz/corpora/
          if-no-files-found: error
          retention-days: 90
