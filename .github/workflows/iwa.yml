# CI: Test the WASM WebTransport server running inside a Chromium Isolated Web App (IWA).
#
# Direct Sockets UDPSocket requires an IWA with the direct-sockets permission,
# which is Chromium-only and behind flags. This workflow automates the packaging
# and runs a headless Chromium to verify the in-browser server actually works.

name: IWA Interop
on:
  schedule:
    - cron: '0 4 * * *' # Daily at 4am
  workflow_dispatch:

jobs:
  iwa-interop:
    name: IWA Browser Server (Direct Sockets)
    runs-on: ubuntu-latest
    env:
      WEBTRANSPORT_SUPPRESS_INSECURE_SKIP_VERIFY_WARN: "1"
      CC_wasm32_unknown_unknown: clang
      AR_wasm32_unknown_unknown: llvm-ar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install wasm C toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm xvfb
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked
      
      - name: Install root deps
        run: bun install --frozen-lockfile
      
      - name: Build web-target wasm
        run: bun run build:wasm:web
      
      - name: Bundle wasm JS for IWA
        run: |
          cd packages/webtransport
          bun build src/wasm.ts --outfile ../../examples/webtransport-wasm-iwa/vendor/webtransport-wasm.js --target browser --format esm
          
      - name: Setup IWA packaging tools
        run: npm i -g wbn wbn-sign playwright
        
      - name: Package IWA
        run: |
          cd examples/webtransport-wasm-iwa
          openssl genpkey -algorithm Ed25519 -out iwa-signing.key.pem
          npx wbn --dir . --output webtransport-wasm-iwa.wbn --formatVersion b2
          node -e '
            const { NodeCryptoSigningStrategy, IntegrityBlockSigner, WebBundleId } = require("wbn-sign");
            const crypto = require("node:crypto"), fs = require("node:fs");
            const key = crypto.createPrivateKey(fs.readFileSync("iwa-signing.key.pem"));
            const origin = new WebBundleId(key).serializeWithIsolatedWebAppOrigin();
            fs.writeFileSync("origin.txt", origin);
            new IntegrityBlockSigner(fs.readFileSync("webtransport-wasm-iwa.wbn"),
              new WebBundleId(key).serialize(),
              [new NodeCryptoSigningStrategy(key)]
            ).sign().then(({ signedWebBundle }) =>
              fs.writeFileSync("webtransport-wasm-iwa.swbn", signedWebBundle));
          '
          
      - name: Run IWA Playwright Test
        run: |
          cat << 'EOF' > test-iwa.mjs
          import { chromium } from "playwright";
          import fs from "node:fs";
          import path from "node:path";
          
          async function run() {
            const origin = fs.readFileSync("examples/webtransport-wasm-iwa/origin.txt", "utf8").trim();
            const swbnPath = path.resolve("examples/webtransport-wasm-iwa/webtransport-wasm-iwa.swbn");
            
            console.log("Launching Chromium with IWA:", origin);
            console.log("SWBN Path:", swbnPath);
            
            const browser = await chromium.launch({
              args: [
                "--enable-features=IsolatedWebApps,IsolatedWebAppDevMode",
                `--install-isolated-web-app-from-url=file://${swbnPath}`
              ]
            });
            
            const context = await browser.newContext({ ignoreHTTPSErrors: true });
            const page = await context.newPage();
            
            page.on("console", msg => console.log("PAGE LOG:", msg.text()));
            
            await page.goto(origin);
            
            console.log("Starting server...");
            await page.click("#start-server");
            await page.waitForFunction(() => {
              return document.getElementById("log").textContent.includes("listening on udp");
            }, { timeout: 10000 });
            
            console.log("Connecting client...");
            await page.click("#connect-client");
            await page.waitForFunction(() => {
              const text = document.getElementById("log").textContent;
              return text.includes("client: got datagram") && text.includes("client: stream echo");
            }, { timeout: 10000 });
            
            console.log("Success! Both datagrams and bidi streams round-tripped.");
            await browser.close();
          }
          
          run().catch(err => {
            console.error("Test failed:", err);
            process.exit(1);
          });
          EOF
          xvfb-run node test-iwa.mjs
