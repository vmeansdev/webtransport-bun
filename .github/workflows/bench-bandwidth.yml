# Bandwidth saturation ladder on the heavy self-hosted runner. Measurement
# only — locates where a host saturates (CPU%, memory vs aggregate Mbps); it
# is not a release gate. Trigger manually via workflow_dispatch.
name: bench-bandwidth
on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: "Exact commit SHA to benchmark"
        required: true
        type: string
      sessions:
        description: "Concurrent sessions held for every ladder step"
        required: false
        default: "100"
        type: string
      payload_bytes:
        description: "Datagram payload size in bytes (MTU-ish for video-style framing)"
        required: false
        default: "1150"
        type: string
      step_seconds:
        description: "Seconds to hold each ladder step"
        required: false
        default: "180"
        type: string
      rates:
        description: "Comma-separated per-session datagrams/s ladder"
        required: false
        default: "27,54,109,217,326,435"
        type: string
      probe_only:
        description: "Run only the GSO/GRO host probe, skip the ladder"
        required: false
        default: "false"
        type: string
      latency_probe:
        description: "Run the latency axis instead of the bandwidth ladder (p50/p99/p999 vs offered rate, BATCH=0 A/B, 64Hz tick arm)"
        required: false
        default: "false"
        type: string
      latency_arms:
        description: "Comma-separated latency arms: default,batch0,tick"
        required: false
        default: "default,batch0,tick"
        type: string
      latency_rates:
        description: "Comma-separated per-session datagrams/s ladder for the latency axis"
        required: false
        default: "100,250,500,750,900,1100"
        type: string
      latency_step_seconds:
        description: "Seconds to hold each latency ladder step"
        required: false
        default: "60"
        type: string
      latency_tick_hz:
        description: "Tick rate for the synchronized-burst arm"
        required: false
        default: "64"
        type: string
      latency_ab:
        description: "Run the interleaved H7 A/B dispatch (86 short alternating arms, medians + CIs, ingest-vs-egress cross-check) instead of the ladder"
        required: false
        default: "false"
        type: string
      latency_ab_drive_seconds:
        description: "Seconds each interleaved arm drives load"
        required: false
        default: "20"
        type: string
      latency_ab_settle_ms:
        description: "Drain grace held before each interleaved arm is snapshotted"
        required: false
        default: "6000"
        type: string
      latency_rtt:
        description: "Run the off-box RTT dispatch (G2 conversion: generator on v-ubuntu-loadgen, client-measured round trip) instead of the ladder"
        required: false
        default: "false"
        type: string
jobs:
  bench:
    permissions:
      contents: read
    runs-on: ["self-hosted", "Linux", "X64", "heavy"]
    # The interleaved A/B is the longest thing this workflow runs: 86 arms at
    # ~32 s each is ~46 min of arms on top of checkout, install and the native
    # build. 120 left too little room for a slow runner to finish honestly.
    timeout-minutes: 180
    concurrency:
      group: bench-bandwidth
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.candidate_commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-07-22
        with:
          node-version: "22.23.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: GSO/GRO host probe
        if: ${{ github.event.inputs.probe_only == 'true' }}
        run: |
          echo "== kernel =="
          uname -a
          IFACE="$(ip route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<NF;i++) if($i=="dev") print $(i+1)}' | head -1)"
          echo "iface=$IFACE"
          if command -v ethtool >/dev/null 2>&1 && [ -n "$IFACE" ]; then
            echo "== driver =="
            ethtool -i "$IFACE" || true
            echo "== offload features (udp/gso/gro) =="
            ethtool -k "$IFACE" | grep -Ei 'udp|gso|gro|segmentation' || true
          else
            echo "ethtool unavailable or iface not found; skipping feature dump"
          fi
          cargo run --release -p reference --bin gso-probe
      - name: Install deps
        if: ${{ github.event.inputs.probe_only != 'true' }}
        run: bun install --frozen-lockfile
      - name: Select supported C/C++ compiler
        run: |
          if command -v clang >/dev/null 2>&1 && command -v clang++ >/dev/null 2>&1; then
            echo "CC=$(realpath "$(command -v clang)")" >> "$GITHUB_ENV"
            echo "CXX=$(realpath "$(command -v clang++)")" >> "$GITHUB_ENV"
            echo "Selected resolved clang/clang++ paths"
            exit 0
          fi

          for v in 12 11 10; do
            if command -v "gcc-$v" >/dev/null 2>&1 && command -v "g++-$v" >/dev/null 2>&1; then
              echo "CC=$(realpath "$(command -v "gcc-$v")")" >> "$GITHUB_ENV"
              echo "CXX=$(realpath "$(command -v "g++-$v")")" >> "$GITHUB_ENV"
              echo "Selected resolved gcc-$v/g++-$v paths"
              exit 0
            fi
          done

          echo "::error::No supported compiler found. Install clang (preferred) or gcc-10+ on this self-hosted runner."
          exit 1
      - name: Build native addon
        if: ${{ github.event.inputs.probe_only != 'true' }}
        run: bun run build:native
      - name: Profile runner capacity
        run: |
          CPUS="$(nproc 2>/dev/null || echo 1)"
          MEM_KB="$(awk '/MemTotal/ {print $2}' /proc/meminfo 2>/dev/null || echo 0)"
          echo "Runner: cpu=$CPUS mem=$((MEM_KB / 1024))MB"
      # Off-box RTT dispatch — G2's conversion. The generator runs on the sibling
      # VM over ssh and dials this host's LAN address, so the client's schedule
      # lag stops competing with the server for the same four vCPU, and the gated
      # quantity becomes a round trip measured on one clock in one process.
      # Cells, order, floor arms on the loadgen, off-box integrity marks,
      # censoring correction and the verdict algebra are pre-registered in
      # docs/research/preregistrations/gate-g2-offbox-rtt.md, with the bare-metal
      # re-derivation in .scratch/bare-metal-campaign/registrations/g2-games.md.
      # The conductor refuses rather than falling back to loopback.
      - name: Run off-box RTT dispatch
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.latency_rtt == 'true' }}
        env:
          LATENCY_RTT_SESSIONS: ${{ github.event.inputs.sessions }}
          LATENCY_RTT_PAYLOAD_BYTES: ${{ github.event.inputs.payload_bytes }}
          # Fixed cable addresses, not dispatch inputs: a whitespace-only input is
          # silently replaced by GitHub with its declared default, and this pair
          # decides whether the run is off-box at all. The generator is the Mac at
          # the far end of the direct cable; the conductor refuses anything
          # outside 10.99.0.0/24, and names 192.168.2.x — the retired loadgen VM's
          # address family, now the family Wi-Fi LAN — in its refusal.
          LATENCY_RTT_OFFBOX_SSH: vmeansdev@10.99.0.1
          LATENCY_RTT_OFFBOX_URL_HOST: 10.99.0.2
        run: |
          set -euo pipefail
          OUTDIR="$GITHUB_WORKSPACE/.bench-evidence"
          mkdir -p "$OUTDIR"
          SHA="${{ github.event.inputs.candidate_commit }}"
          # Route disclosure: the data path must be eno1, never tailscale0 and
          # never wlp1s0. Recorded in the log so the artifact can be read against it.
          ip route get "${LATENCY_RTT_OFFBOX_SSH##*@}" || true
          # The Mac builds its own generator, so the candidate is passed
          # explicitly rather than inferred from the checkout.
          LATENCY_RTT_OUT_DIR="$OUTDIR" LATENCY_RTT_TAG="$SHA" \
            LATENCY_RTT_OFFBOX_CANDIDATE="$SHA" \
            bun tools/load/latency-rtt-conduct.ts
          bun tools/load/latency-rtt-classify.ts \
            "$OUTDIR/bench-latency-rtt-$SHA-classified.json" \
            "$OUTDIR"/bench-latency-rtt-"$SHA"-[0-9]*.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && github.event.inputs.probe_only != 'true' && github.event.inputs.latency_rtt == 'true' }}
        with:
          name: bench-latency-rtt-${{ github.event.inputs.candidate_commit }}
          path: .bench-evidence/bench-latency-rtt-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      # Interleaved H7 A/B. One dispatch of 86 short alternating arm-processes
      # (4 rungs x 10 pairs x 2 arms, plus 3 floor pairs), because two arms run as
      # two long sequential ladders is one paired observation per rate and no
      # dispersion at all. Order, floor rule, honesty check, interval estimator
      # and the four cross-check readings are pre-registered in
      # docs/research/preregistrations/latency-ab.md.
      - name: Run interleaved H7 A/B
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.latency_rtt != 'true' && github.event.inputs.latency_ab == 'true' }}
        env:
          LATENCY_AB_SESSIONS: ${{ github.event.inputs.sessions }}
          LATENCY_AB_PAYLOAD_BYTES: ${{ github.event.inputs.payload_bytes }}
          LATENCY_AB_DRIVE_SECONDS: ${{ github.event.inputs.latency_ab_drive_seconds }}
          LATENCY_AB_SETTLE_MS: ${{ github.event.inputs.latency_ab_settle_ms }}
        run: |
          set -euo pipefail
          OUTDIR="$GITHUB_WORKSPACE/.bench-evidence"
          mkdir -p "$OUTDIR"
          SHA="${{ github.event.inputs.candidate_commit }}"
          LATENCY_AB_OUT_DIR="$OUTDIR" LATENCY_AB_TAG="$SHA" \
            bun tools/load/latency-ab-conduct.ts
          # Classify whatever the dispatch produced. A cell that wrote no fragment
          # is already in the manifest; it is not silently dropped here.
          bun tools/load/latency-ab-classify.ts \
            "$OUTDIR/bench-latency-ab-$SHA-classified.json" \
            "$OUTDIR"/bench-latency-ab-"$SHA"-[0-9]*.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && github.event.inputs.probe_only != 'true' && github.event.inputs.latency_rtt != 'true' && github.event.inputs.latency_ab == 'true' }}
        with:
          name: bench-latency-ab-${{ github.event.inputs.candidate_commit }}
          path: .bench-evidence/bench-latency-ab-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      # Latency ladder. Three arms, one server process each, because the datagram
      # batch knob is read once at import and cannot be varied inside a process.
      # Method, classifier buckets and STOP conditions are pre-registered in
      # docs/research/preregistrations/latency.md.
      - name: Run latency axis
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.latency_rtt != 'true' && github.event.inputs.latency_ab != 'true' && github.event.inputs.latency_probe == 'true' }}
        env:
          LATENCY_SESSIONS: ${{ github.event.inputs.sessions }}
          LATENCY_PAYLOAD_BYTES: ${{ github.event.inputs.payload_bytes }}
          LATENCY_STEP_SECONDS: ${{ github.event.inputs.latency_step_seconds }}
          LATENCY_RATES: ${{ github.event.inputs.latency_rates }}
          LATENCY_TICK_HZ: ${{ github.event.inputs.latency_tick_hz }}
          LATENCY_ARMS: ${{ github.event.inputs.latency_arms }}
        run: |
          set -euo pipefail
          OUTDIR="$GITHUB_WORKSPACE/.bench-evidence"
          mkdir -p "$OUTDIR"
          SHA="${{ github.event.inputs.candidate_commit }}"
          PORT=4433
          FRAGMENTS=""
          IFS=',' read -ra ARMS <<< "$LATENCY_ARMS"
          for ARM in "${ARMS[@]}"; do
            ARM="$(echo "$ARM" | tr -d '[:space:]')"
            [ -n "$ARM" ] || continue
            PORT=$((PORT + 1))
            OUT="$OUTDIR/bench-latency-$SHA-$ARM.json"
            echo "== latency arm $ARM on port $PORT =="
            case "$ARM" in
              batch0) ARM_ENV="WEBTRANSPORT_DATAGRAM_BATCH=0"; ARRIVAL=uniform ;;
              tick)   ARM_ENV="";                              ARRIVAL=tick ;;
              *)      ARM_ENV="";                              ARRIVAL=uniform ;;
            esac
            env $ARM_ENV \
              LATENCY_ARM="$ARM" \
              LATENCY_ARRIVAL="$ARRIVAL" \
              LATENCY_PORT="$PORT" \
              LATENCY_OUT="$OUT" \
              bun tools/load/bench-latency.ts
            FRAGMENTS="$FRAGMENTS $OUT"
          done
          # shellcheck disable=SC2086
          bun tools/load/latency-classify.ts \
            "$OUTDIR/bench-latency-$SHA-classified.json" $FRAGMENTS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && github.event.inputs.probe_only != 'true' && github.event.inputs.latency_rtt != 'true' && github.event.inputs.latency_ab != 'true' && github.event.inputs.latency_probe == 'true' }}
        with:
          name: bench-latency-${{ github.event.inputs.candidate_commit }}
          path: .bench-evidence/bench-latency-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Run bandwidth ladder
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.latency_rtt != 'true' && github.event.inputs.latency_ab != 'true' && github.event.inputs.latency_probe != 'true' }}
        env:
          BENCH_SESSIONS: ${{ github.event.inputs.sessions }}
          BENCH_PAYLOAD_BYTES: ${{ github.event.inputs.payload_bytes }}
          BENCH_STEP_SECONDS: ${{ github.event.inputs.step_seconds }}
          BENCH_RATES: ${{ github.event.inputs.rates }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.bench-evidence"
          BENCH_OUT="$GITHUB_WORKSPACE/.bench-evidence/bench-bandwidth-${{ github.event.inputs.candidate_commit }}.json" \
            bun tools/load/bench-bandwidth.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && github.event.inputs.probe_only != 'true' && github.event.inputs.latency_rtt != 'true' && github.event.inputs.latency_ab != 'true' && github.event.inputs.latency_probe != 'true' }}
        with:
          name: bench-bandwidth-${{ github.event.inputs.candidate_commit }}
          path: .bench-evidence/bench-bandwidth-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
