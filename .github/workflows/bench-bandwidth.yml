# Bandwidth saturation ladder on the heavy self-hosted runner. Measurement
# only — locates where a host saturates (CPU%, memory vs aggregate Mbps); it
# is not a release gate. Trigger manually via workflow_dispatch.
name: bench-bandwidth
on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: "Exact commit SHA to benchmark"
        required: true
        type: string
      sessions:
        description: "Concurrent sessions held for every ladder step"
        required: false
        default: "100"
        type: string
      payload_bytes:
        description: "Datagram payload size in bytes (MTU-ish for video-style framing)"
        required: false
        default: "1150"
        type: string
      step_seconds:
        description: "Seconds to hold each ladder step"
        required: false
        default: "180"
        type: string
      rates:
        description: "Comma-separated per-session datagrams/s ladder"
        required: false
        default: "27,54,109,217,326,435"
        type: string
      probe_only:
        description: "Run only the GSO/GRO host probe, skip the ladder"
        required: false
        default: "false"
        type: string
      latency_probe:
        description: "Run the latency axis instead of the bandwidth ladder (p50/p99/p999 vs offered rate, BATCH=0 A/B, 64Hz tick arm)"
        required: false
        default: "false"
        type: string
      latency_arms:
        description: "Comma-separated latency arms: default,batch0,tick"
        required: false
        default: "default,batch0,tick"
        type: string
      latency_rates:
        description: "Comma-separated per-session datagrams/s ladder for the latency axis"
        required: false
        default: "100,250,500,750,900,1100"
        type: string
      latency_step_seconds:
        description: "Seconds to hold each latency ladder step"
        required: false
        default: "60"
        type: string
      latency_tick_hz:
        description: "Tick rate for the synchronized-burst arm"
        required: false
        default: "64"
        type: string
      egress_probe:
        description: "Run the egress axis (server originates, p99 gate, burst profiles, 1->N fan-out) instead of the bandwidth ladder"
        required: false
        default: "false"
        type: string
      egress_profiles:
        description: "Comma-separated egress burst profiles: constant,frame-bursty,keyframe-aligned,desktop-share"
        required: false
        default: "constant,frame-bursty,keyframe-aligned,desktop-share"
        type: string
      egress_rates:
        description: "Comma-separated per-session datagrams/s ladder for the egress axis (326 is 3 Mbps at 1150 B)"
        required: false
        default: "110,220,326,490,652,815"
        type: string
      egress_step_seconds:
        description: "Seconds to hold each egress ladder step"
        required: false
        default: "45"
        type: string
      egress_fanout_n:
        description: "Comma-separated subscriber counts for the 1-ingest-to-N-egress shape"
        required: false
        default: "10,25,50,100"
        type: string
      egress_fanout_modes:
        description: "Fan-out sweeps to run. Both are needed to separate N from rate."
        required: false
        default: "per-subscriber,constant-aggregate"
        type: string
      egress_fanout_aggregate:
        description: "Forward egress the constant-aggregate sweep pins, datagrams/s"
        required: false
        default: "16500"
        type: string
      egress_gate:
        description: "Run gate G3 (three-arm interleaved comparison at one rung) instead of the egress ladder and fan-out"
        required: false
        default: "false"
        type: string
      egress_gate_emitters:
        description: "Originator arms G3 puts in every block: serial,pipelined,batch"
        required: false
        default: "serial,pipelined,batch"
        type: string
      egress_gate_profiles:
        description: "Burst profiles G3 puts in every block (the second one is the alignment comparison)"
        required: false
        default: "frame-bursty,keyframe-aligned"
        type: string
      egress_gate_blocks:
        description: "Replicate blocks. Every block holds every arm once, in a rotated order."
        required: false
        default: "5"
        type: string
      egress_gate_rate:
        description: "Per-session datagrams/s of G3's single rung (326 x 100 sessions = 32,600/s)"
        required: false
        default: "326"
        type: string
jobs:
  bench:
    permissions:
      contents: read
    runs-on: ["self-hosted", "Linux", "X64", "heavy"]
    timeout-minutes: 120
    concurrency:
      group: bench-bandwidth
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.candidate_commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-07-22
        with:
          node-version: "22.23.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: GSO/GRO host probe
        if: ${{ github.event.inputs.probe_only == 'true' }}
        run: |
          echo "== kernel =="
          uname -a
          IFACE="$(ip route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<NF;i++) if($i=="dev") print $(i+1)}' | head -1)"
          echo "iface=$IFACE"
          if command -v ethtool >/dev/null 2>&1 && [ -n "$IFACE" ]; then
            echo "== driver =="
            ethtool -i "$IFACE" || true
            echo "== offload features (udp/gso/gro) =="
            ethtool -k "$IFACE" | grep -Ei 'udp|gso|gro|segmentation' || true
          else
            echo "ethtool unavailable or iface not found; skipping feature dump"
          fi
          cargo run --release -p reference --bin gso-probe
      - name: Install deps
        if: ${{ github.event.inputs.probe_only != 'true' }}
        run: bun install --frozen-lockfile
      - name: Select supported C/C++ compiler
        run: |
          if command -v clang >/dev/null 2>&1 && command -v clang++ >/dev/null 2>&1; then
            echo "CC=$(realpath "$(command -v clang)")" >> "$GITHUB_ENV"
            echo "CXX=$(realpath "$(command -v clang++)")" >> "$GITHUB_ENV"
            echo "Selected resolved clang/clang++ paths"
            exit 0
          fi

          for v in 12 11 10; do
            if command -v "gcc-$v" >/dev/null 2>&1 && command -v "g++-$v" >/dev/null 2>&1; then
              echo "CC=$(realpath "$(command -v "gcc-$v")")" >> "$GITHUB_ENV"
              echo "CXX=$(realpath "$(command -v "g++-$v")")" >> "$GITHUB_ENV"
              echo "Selected resolved gcc-$v/g++-$v paths"
              exit 0
            fi
          done

          echo "::error::No supported compiler found. Install clang (preferred) or gcc-10+ on this self-hosted runner."
          exit 1
      - name: Build native addon
        if: ${{ github.event.inputs.probe_only != 'true' }}
        run: bun run build:native
      - name: Profile runner capacity
        run: |
          CPUS="$(nproc 2>/dev/null || echo 1)"
          MEM_KB="$(awk '/MemTotal/ {print $2}' /proc/meminfo 2>/dev/null || echo 0)"
          echo "Runner: cpu=$CPUS mem=$((MEM_KB / 1024))MB"
      # Latency axis. Three arms, one server process each, because the datagram
      # batch knob is read once at import and cannot be varied inside a process.
      # Method, classifier buckets and STOP conditions are pre-registered in
      # docs/research/preregistrations/latency.md.
      - name: Run latency axis
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.egress_probe != 'true' && github.event.inputs.latency_probe == 'true' }}
        env:
          LATENCY_SESSIONS: ${{ github.event.inputs.sessions }}
          LATENCY_PAYLOAD_BYTES: ${{ github.event.inputs.payload_bytes }}
          LATENCY_STEP_SECONDS: ${{ github.event.inputs.latency_step_seconds }}
          LATENCY_RATES: ${{ github.event.inputs.latency_rates }}
          LATENCY_TICK_HZ: ${{ github.event.inputs.latency_tick_hz }}
          LATENCY_ARMS: ${{ github.event.inputs.latency_arms }}
        run: |
          set -euo pipefail
          OUTDIR="$GITHUB_WORKSPACE/.bench-evidence"
          mkdir -p "$OUTDIR"
          SHA="${{ github.event.inputs.candidate_commit }}"
          PORT=4433
          FRAGMENTS=""
          IFS=',' read -ra ARMS <<< "$LATENCY_ARMS"
          for ARM in "${ARMS[@]}"; do
            ARM="$(echo "$ARM" | tr -d '[:space:]')"
            [ -n "$ARM" ] || continue
            PORT=$((PORT + 1))
            OUT="$OUTDIR/bench-latency-$SHA-$ARM.json"
            echo "== latency arm $ARM on port $PORT =="
            case "$ARM" in
              batch0) ARM_ENV="WEBTRANSPORT_DATAGRAM_BATCH=0"; ARRIVAL=uniform ;;
              tick)   ARM_ENV="";                              ARRIVAL=tick ;;
              *)      ARM_ENV="";                              ARRIVAL=uniform ;;
            esac
            env $ARM_ENV \
              LATENCY_ARM="$ARM" \
              LATENCY_ARRIVAL="$ARRIVAL" \
              LATENCY_PORT="$PORT" \
              LATENCY_OUT="$OUT" \
              bun tools/load/bench-latency.ts
            FRAGMENTS="$FRAGMENTS $OUT"
          done
          # shellcheck disable=SC2086
          bun tools/load/latency-classify.ts \
            "$OUTDIR/bench-latency-$SHA-classified.json" $FRAGMENTS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && github.event.inputs.probe_only != 'true' && github.event.inputs.egress_probe != 'true' && github.event.inputs.latency_probe == 'true' }}
        with:
          name: bench-latency-${{ github.event.inputs.candidate_commit }}
          path: .bench-evidence/bench-latency-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      # Egress axis. The generator-headroom control runs first, on a loaded
      # server: unless the JS originator demonstrably outruns what the ladder
      # asks of it, while the transport is carrying the ladder's top rung, no
      # capacity number from the ladder below is allowed to mean anything. One
      # server process per burst profile, then the 1->N fan-out shape.
      # Method, gates, buckets and STOP conditions are pre-registered in
      # docs/research/preregistrations/egress.md.
      - name: Run egress axis
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.egress_probe == 'true' }}
        env:
          EGRESS_SESSIONS: ${{ github.event.inputs.sessions }}
          EGRESS_PAYLOAD_BYTES: ${{ github.event.inputs.payload_bytes }}
          EGRESS_STEP_SECONDS: ${{ github.event.inputs.egress_step_seconds }}
          EGRESS_RATES: ${{ github.event.inputs.egress_rates }}
          EGRESS_FANOUT_N: ${{ github.event.inputs.egress_fanout_n }}
          EGRESS_FANOUT_MODES: ${{ github.event.inputs.egress_fanout_modes }}
          EGRESS_FANOUT_AGGREGATE: ${{ github.event.inputs.egress_fanout_aggregate }}
          EGRESS_PROFILES: ${{ github.event.inputs.egress_profiles }}
          EGRESS_GATE: ${{ github.event.inputs.egress_gate }}
          EGRESS_GATE_EMITTERS: ${{ github.event.inputs.egress_gate_emitters }}
          EGRESS_GATE_PROFILES: ${{ github.event.inputs.egress_gate_profiles }}
          EGRESS_GATE_BLOCKS: ${{ github.event.inputs.egress_gate_blocks }}
          EGRESS_GATE_RATE: ${{ github.event.inputs.egress_gate_rate }}
        run: |
          set -euo pipefail
          OUTDIR="$GITHUB_WORKSPACE/.bench-evidence"
          mkdir -p "$OUTDIR"
          SHA="${{ github.event.inputs.candidate_commit }}"
          PORT=4450
          FRAGMENTS=""
          # Gate G3: the headroom control runs once per originator arm, because a
          # ceiling never crosses arms — an arm that cannot honestly source the
          # rung contributes no number and lends none. Then one gate shape drives
          # every (profile, emitter) cell, interleaved inside replicate blocks.
          # Registered in docs/research/preregistrations/gate-g3.md.
          if [ "$EGRESS_GATE" = "true" ]; then
            IFS=',' read -ra ARMS <<< "$EGRESS_GATE_EMITTERS"
            for ARM in "${ARMS[@]}"; do
              ARM="$(echo "$ARM" | tr -d '[:space:]')"
              [ -n "$ARM" ] || continue
              PORT=$((PORT + 1))
              GEN="$OUTDIR/bench-egress-$SHA-headroom-$ARM.json"
              echo "== G3 generator-headroom control, arm $ARM (loaded server) =="
              EGRESS_SHAPE=headroom EGRESS_EMITTER="$ARM" \
                EGRESS_PROFILE=frame-bursty \
                EGRESS_HEADROOM_RATE="$EGRESS_GATE_RATE" \
                EGRESS_PORT="$PORT" EGRESS_OUT="$GEN" \
                bun tools/load/bench-egress.ts
              FRAGMENTS="$FRAGMENTS $GEN"
            done
            PORT=$((PORT + 1))
            GATE="$OUTDIR/bench-egress-$SHA-gate.json"
            echo "== G3 three-arm interleaved comparison at $EGRESS_GATE_RATE/s/session =="
            EGRESS_SHAPE=gate EGRESS_PORT="$PORT" EGRESS_OUT="$GATE" \
              bun tools/load/bench-egress.ts
            FRAGMENTS="$FRAGMENTS $GATE"
            # shellcheck disable=SC2086
            bun tools/load/egress-classify.ts \
              "$OUTDIR/bench-egress-$SHA-classified.json" $FRAGMENTS
            exit 0
          fi
          GEN="$OUTDIR/bench-egress-$SHA-headroom.json"
          echo "== egress generator-headroom control (loaded server) =="
          EGRESS_SHAPE=headroom EGRESS_PORT="$PORT" EGRESS_OUT="$GEN" \
            bun tools/load/bench-egress.ts
          FRAGMENTS="$GEN"
          IFS=',' read -ra PROFILES <<< "$EGRESS_PROFILES"
          for PROFILE in "${PROFILES[@]}"; do
            PROFILE="$(echo "$PROFILE" | tr -d '[:space:]')"
            [ -n "$PROFILE" ] || continue
            PORT=$((PORT + 1))
            OUT="$OUTDIR/bench-egress-$SHA-ladder-$PROFILE.json"
            echo "== egress ladder profile $PROFILE on port $PORT =="
            EGRESS_SHAPE=ladder EGRESS_PROFILE="$PROFILE" EGRESS_PORT="$PORT" \
              EGRESS_OUT="$OUT" bun tools/load/bench-egress.ts
            FRAGMENTS="$FRAGMENTS $OUT"
          done
          # Both fan-out sweeps, each its own server process and its own fragment.
          # An effect that shows up when the per-subscriber rate is held and
          # vanishes when the aggregate is pinned is a rate effect, not an N
          # effect, and only running both can tell the two apart.
          IFS=',' read -ra FANOUT_MODES <<< "$EGRESS_FANOUT_MODES"
          for MODE in "${FANOUT_MODES[@]}"; do
            MODE="$(echo "$MODE" | tr -d '[:space:]')"
            [ -n "$MODE" ] || continue
            PORT=$((PORT + 1))
            FAN="$OUTDIR/bench-egress-$SHA-fanout-$MODE.json"
            echo "== egress fan-out sweep $MODE on port $PORT =="
            EGRESS_SHAPE=fanout EGRESS_FANOUT_MODE="$MODE" EGRESS_PORT="$PORT" \
              EGRESS_OUT="$FAN" bun tools/load/bench-egress.ts
            FRAGMENTS="$FRAGMENTS $FAN"
          done
          # shellcheck disable=SC2086
          bun tools/load/egress-classify.ts \
            "$OUTDIR/bench-egress-$SHA-classified.json" $FRAGMENTS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && github.event.inputs.probe_only != 'true' && github.event.inputs.egress_probe == 'true' }}
        with:
          name: bench-egress-${{ github.event.inputs.candidate_commit }}
          path: .bench-evidence/bench-egress-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Run bandwidth ladder
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.latency_probe != 'true' && github.event.inputs.egress_probe != 'true' }}
        env:
          BENCH_SESSIONS: ${{ github.event.inputs.sessions }}
          BENCH_PAYLOAD_BYTES: ${{ github.event.inputs.payload_bytes }}
          BENCH_STEP_SECONDS: ${{ github.event.inputs.step_seconds }}
          BENCH_RATES: ${{ github.event.inputs.rates }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.bench-evidence"
          BENCH_OUT="$GITHUB_WORKSPACE/.bench-evidence/bench-bandwidth-${{ github.event.inputs.candidate_commit }}.json" \
            bun tools/load/bench-bandwidth.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && github.event.inputs.probe_only != 'true' && github.event.inputs.latency_probe != 'true' && github.event.inputs.egress_probe != 'true' }}
        with:
          name: bench-bandwidth-${{ github.event.inputs.candidate_commit }}
          path: .bench-evidence/bench-bandwidth-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
