# Bandwidth saturation ladder on the heavy self-hosted runner. Measurement
# only — locates where a host saturates (CPU%, memory vs aggregate Mbps); it
# is not a release gate. Trigger manually via workflow_dispatch.
name: bench-bandwidth
on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: "Exact commit SHA to benchmark"
        required: true
        type: string
      sessions:
        description: "Concurrent sessions held for every ladder step"
        required: false
        default: "100"
        type: string
      payload_bytes:
        description: "Datagram payload size in bytes (MTU-ish for video-style framing)"
        required: false
        default: "1150"
        type: string
      step_seconds:
        description: "Seconds to hold each ladder step"
        required: false
        default: "180"
        type: string
      rates:
        description: "Comma-separated per-session datagrams/s ladder"
        required: false
        default: "27,54,109,217,326,435"
        type: string
      probe_only:
        description: "Run only the GSO/GRO host probe, skip the ladder"
        required: false
        default: "false"
        type: string
      latency_probe:
        description: "Run the latency axis instead of the bandwidth ladder (p50/p99/p999 vs offered rate, BATCH=0 A/B, 64Hz tick arm)"
        required: false
        default: "false"
        type: string
      latency_arms:
        description: "Comma-separated latency arms: default,batch0,tick"
        required: false
        default: "default,batch0,tick"
        type: string
      latency_rates:
        description: "Comma-separated per-session datagrams/s ladder for the latency axis"
        required: false
        default: "100,250,500,750,900,1100"
        type: string
      latency_step_seconds:
        description: "Seconds to hold each latency ladder step"
        required: false
        default: "60"
        type: string
      latency_tick_hz:
        description: "Tick rate for the synchronized-burst arm"
        required: false
        default: "64"
        type: string
      latency_send_sync:
        description: "WEBTRANSPORT_DATAGRAM_SEND_SYNC for every latency arm; leave empty for the shipped default. Set to 0 for the promise-path positive control (prereg Amendment 6)"
        required: false
        default: ""
        type: string
      latency_watchdog_grace_sec:
        description: "Seconds to wait after an arm writes its fragment before killing the driver (a driver still alive then is pinned)"
        required: false
        default: "900"
        type: string
      latency_watchdog_ceiling_sec:
        description: "Seconds an arm may run without writing its fragment before it is killed as a harness fault"
        required: false
        default: "1200"
        type: string
jobs:
  bench:
    permissions:
      contents: read
    runs-on: ["self-hosted", "Linux", "X64", "heavy"]
    timeout-minutes: 120
    concurrency:
      group: bench-bandwidth
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.candidate_commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-07-22
        with:
          node-version: "22.23.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: GSO/GRO host probe
        if: ${{ github.event.inputs.probe_only == 'true' }}
        run: |
          echo "== kernel =="
          uname -a
          IFACE="$(ip route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<NF;i++) if($i=="dev") print $(i+1)}' | head -1)"
          echo "iface=$IFACE"
          if command -v ethtool >/dev/null 2>&1 && [ -n "$IFACE" ]; then
            echo "== driver =="
            ethtool -i "$IFACE" || true
            echo "== offload features (udp/gso/gro) =="
            ethtool -k "$IFACE" | grep -Ei 'udp|gso|gro|segmentation' || true
          else
            echo "ethtool unavailable or iface not found; skipping feature dump"
          fi
          cargo run --release -p reference --bin gso-probe
      - name: Install deps
        if: ${{ github.event.inputs.probe_only != 'true' }}
        run: bun install --frozen-lockfile
      - name: Select supported C/C++ compiler
        run: |
          if command -v clang >/dev/null 2>&1 && command -v clang++ >/dev/null 2>&1; then
            echo "CC=$(realpath "$(command -v clang)")" >> "$GITHUB_ENV"
            echo "CXX=$(realpath "$(command -v clang++)")" >> "$GITHUB_ENV"
            echo "Selected resolved clang/clang++ paths"
            exit 0
          fi

          for v in 12 11 10; do
            if command -v "gcc-$v" >/dev/null 2>&1 && command -v "g++-$v" >/dev/null 2>&1; then
              echo "CC=$(realpath "$(command -v "gcc-$v")")" >> "$GITHUB_ENV"
              echo "CXX=$(realpath "$(command -v "g++-$v")")" >> "$GITHUB_ENV"
              echo "Selected resolved gcc-$v/g++-$v paths"
              exit 0
            fi
          done

          echo "::error::No supported compiler found. Install clang (preferred) or gcc-10+ on this self-hosted runner."
          exit 1
      - name: Build native addon
        if: ${{ github.event.inputs.probe_only != 'true' }}
        run: bun run build:native
      - name: Profile runner capacity
        run: |
          CPUS="$(nproc 2>/dev/null || echo 1)"
          MEM_KB="$(awk '/MemTotal/ {print $2}' /proc/meminfo 2>/dev/null || echo 0)"
          echo "Runner: cpu=$CPUS mem=$((MEM_KB / 1024))MB"
      # Latency axis. Three arms, one server process each, because the datagram
      # batch knob is read once at import and cannot be varied inside a process.
      # Method, classifier buckets and STOP conditions are pre-registered in
      # docs/research/preregistrations/latency.md.
      - name: Run latency axis
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.latency_probe == 'true' }}
        # Backstop only. The per-arm watchdog below is what actually bounds a
        # pinned driver; this keeps a failure of the watchdog itself from
        # holding the heavy runner for the full job timeout.
        timeout-minutes: 75
        env:
          LATENCY_SESSIONS: ${{ github.event.inputs.sessions }}
          LATENCY_PAYLOAD_BYTES: ${{ github.event.inputs.payload_bytes }}
          LATENCY_STEP_SECONDS: ${{ github.event.inputs.latency_step_seconds }}
          LATENCY_RATES: ${{ github.event.inputs.latency_rates }}
          LATENCY_TICK_HZ: ${{ github.event.inputs.latency_tick_hz }}
          LATENCY_ARMS: ${{ github.event.inputs.latency_arms }}
          LATENCY_SEND_SYNC: ${{ github.event.inputs.latency_send_sync }}
          WATCHDOG_GRACE_SEC: ${{ github.event.inputs.latency_watchdog_grace_sec }}
          WATCHDOG_CEILING_SEC: ${{ github.event.inputs.latency_watchdog_ceiling_sec }}
        run: |
          set -euo pipefail
          OUTDIR="$GITHUB_WORKSPACE/.bench-evidence"
          mkdir -p "$OUTDIR"
          SHA="${{ github.event.inputs.candidate_commit }}"
          PORT=4433
          FRAGMENTS=""
          SEND_SYNC="$(echo "${LATENCY_SEND_SYNC:-}" | tr -d '[:space:]')"
          GRACE="$(echo "${WATCHDOG_GRACE_SEC:-}" | tr -d '[:space:]')"
          CEILING="$(echo "${WATCHDOG_CEILING_SEC:-}" | tr -d '[:space:]')"
          GRACE="${GRACE:-900}"
          CEILING="${CEILING:-1200}"
          echo "watchdog: grace=${GRACE}s after fragment write, ceiling=${CEILING}s before it"
          if [ -n "$SEND_SYNC" ]; then
            echo "arm env: WEBTRANSPORT_DATAGRAM_SEND_SYNC=$SEND_SYNC (prereg Amendment 6 control)"
            SEND_SYNC_JSON="\"$SEND_SYNC\""
          else
            SEND_SYNC_JSON=null
          fi
          MISSING=""
          IFS=',' read -ra ARMS <<< "$LATENCY_ARMS"
          for ARM in "${ARMS[@]}"; do
            ARM="$(echo "$ARM" | tr -d '[:space:]')"
            [ -n "$ARM" ] || continue
            PORT=$((PORT + 1))
            OUT="$OUTDIR/bench-latency-$SHA-$ARM.json"
            WATCH="$OUTDIR/bench-latency-$SHA-$ARM.watchdog.json"
            rm -f "$OUT"
            echo "== latency arm $ARM on port $PORT =="
            case "$ARM" in
              batch0) ARM_ENV="WEBTRANSPORT_DATAGRAM_BATCH=0"; ARRIVAL=uniform ;;
              tick)   ARM_ENV="";                              ARRIVAL=tick ;;
              *)      ARM_ENV="";                              ARRIVAL=uniform ;;
            esac
            if [ -n "$SEND_SYNC" ]; then
              ARM_ENV="$ARM_ENV WEBTRANSPORT_DATAGRAM_SEND_SYNC=$SEND_SYNC"
            fi
            START="$(date +%s)"
            # shellcheck disable=SC2086
            env $ARM_ENV \
              LATENCY_ARM="$ARM" \
              LATENCY_ARRIVAL="$ARRIVAL" \
              LATENCY_PORT="$PORT" \
              LATENCY_OUT="$OUT" \
              bun tools/load/bench-latency.ts &
            DRIVER=$!
            # The driver has no post-write work — no I/O, no timers — so an exit
            # follows its fragment write immediately. Still alive GRACE seconds
            # after the write means the addon is holding the host event loop:
            # that is the pin, and killing it is how the arm reports it.
            WROTE_AT=""
            KILLED=false
            while kill -0 "$DRIVER" 2>/dev/null; do
              NOW="$(date +%s)"
              if [ -z "$WROTE_AT" ] && [ -s "$OUT" ]; then
                WROTE_AT="$NOW"
                echo "watchdog: arm $ARM wrote its fragment at +$((NOW - START))s; kill deadline +${GRACE}s"
              fi
              if [ -n "$WROTE_AT" ]; then DEADLINE=$((WROTE_AT + GRACE)); else DEADLINE=$((START + CEILING)); fi
              if [ "$NOW" -ge "$DEADLINE" ]; then
                echo "::warning::watchdog killing arm $ARM at +$((NOW - START))s (fragment written: $([ -n "$WROTE_AT" ] && echo yes || echo no))"
                kill -KILL "$DRIVER" 2>/dev/null || true
                pkill -KILL -P "$DRIVER" 2>/dev/null || true
                pkill -KILL -f 'target/release/load-client' 2>/dev/null || true
                KILLED=true
                break
              fi
              sleep 5
            done
            CODE=0
            wait "$DRIVER" || CODE=$?
            END="$(date +%s)"
            WROTE=false
            SEC_TO_FRAGMENT=null
            SEC_AFTER_FRAGMENT=null
            # A driver that wrote and exited inside one poll interval never had
            # its write observed; the fragment's mtime is the same instant.
            if [ -z "$WROTE_AT" ] && [ -s "$OUT" ]; then
              WROTE_AT="$(stat -c %Y "$OUT" 2>/dev/null || true)"
            fi
            if [ -s "$OUT" ]; then
              WROTE=true
              if [ -n "$WROTE_AT" ]; then
                SEC_TO_FRAGMENT=$((WROTE_AT - START))
                SEC_AFTER_FRAGMENT=$((END - WROTE_AT))
              fi
            fi
            printf '{"arm":"%s","exitCode":%d,"killedByWatchdog":%s,"fragmentWritten":%s,"secondsToFragment":%s,"secondsAfterFragment":%s,"armSeconds":%d,"graceSec":%d,"ceilingSec":%d,"sendSyncEnv":%s}\n' \
              "$ARM" "$CODE" "$KILLED" "$WROTE" "$SEC_TO_FRAGMENT" "$SEC_AFTER_FRAGMENT" \
              "$((END - START))" "$GRACE" "$CEILING" "$SEND_SYNC_JSON" > "$WATCH"
            echo "watchdog: arm $ARM exit=$CODE killed=$KILLED fragment=$WROTE elapsed=$((END - START))s"
            if [ "$WROTE" = true ]; then
              FRAGMENTS="$FRAGMENTS $OUT"
            else
              MISSING="$MISSING $ARM"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::latency arm(s) produced no fragment:$MISSING"
            exit 1
          fi
          # shellcheck disable=SC2086
          bun tools/load/latency-classify.ts \
            "$OUTDIR/bench-latency-$SHA-classified.json" $FRAGMENTS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && github.event.inputs.probe_only != 'true' && github.event.inputs.latency_probe == 'true' }}
        with:
          name: bench-latency-${{ github.event.inputs.candidate_commit }}
          path: .bench-evidence/bench-latency-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Run bandwidth ladder
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.latency_probe != 'true' }}
        env:
          BENCH_SESSIONS: ${{ github.event.inputs.sessions }}
          BENCH_PAYLOAD_BYTES: ${{ github.event.inputs.payload_bytes }}
          BENCH_STEP_SECONDS: ${{ github.event.inputs.step_seconds }}
          BENCH_RATES: ${{ github.event.inputs.rates }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.bench-evidence"
          BENCH_OUT="$GITHUB_WORKSPACE/.bench-evidence/bench-bandwidth-${{ github.event.inputs.candidate_commit }}.json" \
            bun tools/load/bench-bandwidth.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && github.event.inputs.probe_only != 'true' && github.event.inputs.latency_probe != 'true' }}
        with:
          name: bench-bandwidth-${{ github.event.inputs.candidate_commit }}
          path: .bench-evidence/bench-bandwidth-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
