# Bandwidth saturation ladder on the heavy self-hosted runner. Measurement
# only — locates where a host saturates (CPU%, memory vs aggregate Mbps); it
# is not a release gate. Trigger manually via workflow_dispatch.
name: bench-bandwidth
on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: "Exact commit SHA to benchmark"
        required: true
        type: string
      sessions:
        description: "Concurrent sessions held for every ladder step"
        required: false
        default: "100"
        type: string
      payload_bytes:
        description: "Datagram payload size in bytes (MTU-ish for video-style framing)"
        required: false
        default: "1150"
        type: string
      step_seconds:
        description: "Seconds to hold each ladder step"
        required: false
        default: "180"
        type: string
      rates:
        description: "Comma-separated per-session datagrams/s ladder"
        required: false
        default: "27,54,109,217,326,435"
        type: string
      g11_arms:
        description: "g11-bidi mode: comma-separated arms (T=tunnel, X=acceptance, J=addon-both-ends, D=cross-direction budget probe)"
        required: false
        default: "T,X,J,D"
        type: string
      g11_cells:
        description: "g11-bidi mode: explicit comma-separated cell list; overrides g11_arms. Every cell must be registered at this invocation's knob state"
        required: false
        default: ""
        type: string
      g11_cells_knobon:
        description: "g11-bidi mode: cell list for the knob-ON (verdict-free) invocation; empty string skips invocation 2 entirely. Emptying it omits the C9 disclosure cells and must be named in the run's §12 entry (Amendment 7)"
        required: false
        default: "T-100-batch,J-batch"
        type: string
      g11_step_seconds:
        description: "g11-bidi mode: seconds of drive per Arm T / Arm J cell"
        required: false
        default: "60"
        type: string
      g11_exchange_step_seconds:
        description: "g11-bidi mode: seconds of drive per Arm X cell"
        required: false
        default: "30"
        type: string
      g11_coupling_step_seconds:
        description: "g11-bidi mode: seconds of drive per Arm D cell"
        required: false
        default: "30"
        type: string
      g11_repeats:
        description: "g11-bidi mode: repeats of the gate cell T-100 (the registration says 2)"
        required: false
        default: "2"
        type: string
      g11_generator:
        description: "g11-bidi mode: comma-separated generator overrides, e.g. 'originator=native,deframe=2'. originator: js (default, the registered per-frame JS pacer) or native (the addon's runPacedEmitter loop, arm T only; stamped per cell as downOriginator). deframe: auto (default) or an explicit arm-T deframe-worker count (0 = inline). Empty = all defaults; unknown keys fail the dispatch."
        required: false
        default: ""
        type: string
      probe_only:
        description: "Run only the GSO/GRO host probe, skip the ladder"
        required: false
        default: "false"
        type: string
      mode:
        description: "bandwidth (datagram ladder, default), stream (stream-throughput axis), gate-g5 (gate G5, unpaced), gate-g5b (gate G5 paced), or g11-bidi (gate G11, bidirectional tunnels; the gates take no threshold inputs — their bars are pre-registered)"
        required: false
        default: "bandwidth"
        type: string
      stream_arms:
        description: "stream mode: comma-separated arms to run (A=bulk bytes/write size, B=open/close ceiling, C=datagram vs stream, W=flow-control window sweep)"
        required: false
        default: "A,B,C"
        type: string
      stream_a_step_seconds:
        description: "stream mode: seconds per Arm A write-size step"
        required: false
        default: "60"
        type: string
      stream_a_write_sizes:
        description: "stream mode: comma-separated Arm A client write sizes in bytes"
        required: false
        default: "4096,16384,65536,262144,1048576"
        type: string
      stream_b_step_seconds:
        description: "stream mode: seconds per Arm B concurrency step"
        required: false
        default: "30"
        type: string
      stream_b_concurrency:
        description: "stream mode: comma-separated Arm B in-flight streams per session"
        required: false
        default: "1,4,16,64,256"
        type: string
      stream_c_step_seconds:
        description: "stream mode: seconds per Arm C sub-arm"
        required: false
        default: "60"
        type: string
      stream_c_target_mbps:
        description: "stream mode: matched offered aggregate rate for Arm C"
        required: false
        default: "600"
        type: string
      stream_w_step_seconds:
        description: "stream mode: seconds per Arm W window rung"
        required: false
        default: "60"
        type: string
      stream_w_windows:
        description: "stream mode: comma-separated Arm W maxQueuedBytesPerStream rungs (per-session follows at the ratio below)"
        required: false
        default: "262144,524288,1048576,2097152,4194304,8388608,16777216"
        type: string
      stream_w_session_ratio:
        description: "stream mode: Arm W maxQueuedBytesPerSession as a multiple of per-stream (8 = the shipped 2 MiB : 256 KiB ratio)"
        required: false
        default: "8"
        type: string
jobs:
  bench:
    permissions:
      contents: read
    runs-on: ["self-hosted", "Linux", "X64", "heavy"]
    timeout-minutes: 120
    concurrency:
      group: bench-bandwidth
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.candidate_commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-07-22
        with:
          node-version: "22.23.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      # Host GSO/GRO *capability*. In stream mode this runs alongside the
      # ladder on purpose: the ladder reports actual per-syscall coalescing
      # from quinn's own counters, and capability-without-engagement is exactly
      # the silent-fallback case worth catching side by side.
      - name: GSO/GRO host probe
        if: ${{ github.event.inputs.probe_only == 'true' || github.event.inputs.mode == 'stream' || github.event.inputs.mode == 'gate-g5' || github.event.inputs.mode == 'gate-g5b' || github.event.inputs.mode == 'g11-bidi' }}
        run: |
          echo "== kernel =="
          uname -a
          IFACE="$(ip route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<NF;i++) if($i=="dev") print $(i+1)}' | head -1)"
          echo "iface=$IFACE"
          if command -v ethtool >/dev/null 2>&1 && [ -n "$IFACE" ]; then
            echo "== driver =="
            ethtool -i "$IFACE" || true
            echo "== offload features (udp/gso/gro) =="
            ethtool -k "$IFACE" | grep -Ei 'udp|gso|gro|segmentation' || true
          else
            echo "ethtool unavailable or iface not found; skipping feature dump"
          fi
          cargo run --release -p reference --bin gso-probe
      - name: Install deps
        if: ${{ github.event.inputs.probe_only != 'true' }}
        run: bun install --frozen-lockfile
      - name: Select supported C/C++ compiler
        run: |
          if command -v clang >/dev/null 2>&1 && command -v clang++ >/dev/null 2>&1; then
            echo "CC=$(realpath "$(command -v clang)")" >> "$GITHUB_ENV"
            echo "CXX=$(realpath "$(command -v clang++)")" >> "$GITHUB_ENV"
            echo "Selected resolved clang/clang++ paths"
            exit 0
          fi

          for v in 12 11 10; do
            if command -v "gcc-$v" >/dev/null 2>&1 && command -v "g++-$v" >/dev/null 2>&1; then
              echo "CC=$(realpath "$(command -v "gcc-$v")")" >> "$GITHUB_ENV"
              echo "CXX=$(realpath "$(command -v "g++-$v")")" >> "$GITHUB_ENV"
              echo "Selected resolved gcc-$v/g++-$v paths"
              exit 0
            fi
          done

          echo "::error::No supported compiler found. Install clang (preferred) or gcc-10+ on this self-hosted runner."
          exit 1
      - name: Build native addon
        if: ${{ github.event.inputs.probe_only != 'true' }}
        run: bun run build:native
      - name: Profile runner capacity
        run: |
          CPUS="$(nproc 2>/dev/null || echo 1)"
          MEM_KB="$(awk '/MemTotal/ {print $2}' /proc/meminfo 2>/dev/null || echo 0)"
          echo "Runner: cpu=$CPUS mem=$((MEM_KB / 1024))MB"
      - name: Run bandwidth ladder
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.mode != 'stream' && github.event.inputs.mode != 'gate-g5' && github.event.inputs.mode != 'gate-g5b' && github.event.inputs.mode != 'g11-bidi' }}
        env:
          BENCH_SESSIONS: ${{ github.event.inputs.sessions }}
          BENCH_PAYLOAD_BYTES: ${{ github.event.inputs.payload_bytes }}
          BENCH_STEP_SECONDS: ${{ github.event.inputs.step_seconds }}
          BENCH_RATES: ${{ github.event.inputs.rates }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.bench-evidence"
          BENCH_OUT="$GITHUB_WORKSPACE/.bench-evidence/bench-bandwidth-${{ github.event.inputs.candidate_commit }}.json" \
            bun tools/load/bench-bandwidth.ts
      # Stream-throughput axis. Pre-registration (arms, classifier buckets, STOP
      # conditions): docs/research/preregistrations/stream-throughput.md
      - name: Run stream ladder
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.mode == 'stream' }}
        env:
          BENCH_STREAM_ARMS: ${{ github.event.inputs.stream_arms }}
          BENCH_A_STEP_SECONDS: ${{ github.event.inputs.stream_a_step_seconds }}
          BENCH_A_WRITE_SIZES: ${{ github.event.inputs.stream_a_write_sizes }}
          BENCH_B_STEP_SECONDS: ${{ github.event.inputs.stream_b_step_seconds }}
          BENCH_B_CONCURRENCY: ${{ github.event.inputs.stream_b_concurrency }}
          BENCH_C_STEP_SECONDS: ${{ github.event.inputs.stream_c_step_seconds }}
          BENCH_C_TARGET_MBPS: ${{ github.event.inputs.stream_c_target_mbps }}
          BENCH_W_STEP_SECONDS: ${{ github.event.inputs.stream_w_step_seconds }}
          BENCH_W_WINDOWS: ${{ github.event.inputs.stream_w_windows }}
          BENCH_W_SESSION_RATIO: ${{ github.event.inputs.stream_w_session_ratio }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.bench-evidence"
          BENCH_OUT="$GITHUB_WORKSPACE/.bench-evidence/bench-stream-${{ github.event.inputs.candidate_commit }}.json" \
            bun tools/load/bench-stream.ts
      # Gate G5. Pre-registration: docs/research/preregistrations/gate-g5-bulk.md
      #
      # Deliberately takes no tunable dispatch inputs: the arms, the repeat count
      # and the batch budget are fixed in the committed harness, so what ran is
      # what was registered and not what a dispatch form said.
      #
      # WEBTRANSPORT_STREAM_BATCH_BYTES is read once at module init, so the
      # knob-off cells and the knob-on cells cannot share a process. Two harness
      # invocations, then a third pass that applies the verdict rules across both
      # artifacts. One dispatch, one runner, one candidate.
      - name: Run gate G5
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.mode == 'gate-g5' }}
        env:
          WEBTRANSPORT_STREAM_BATCH_DIAGNOSTICS: "1"
          BENCH_STREAM_ARMS: G
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.bench-evidence"
          EV="$GITHUB_WORKSPACE/.bench-evidence"
          SHA="${{ github.event.inputs.candidate_commit }}"

          echo "::group::G5 invocation 1 — knob OFF (G-control, G-window-ref)"
          BENCH_G_CELLS="G-control,G-window-ref" \
            BENCH_OUT="$EV/bench-stream-g5-knoboff-$SHA.json" \
            bun tools/load/bench-stream.ts
          echo "::endgroup::"

          echo "::group::G5 invocation 2 — knob ON at 65536 (G-batch, G-window-batch)"
          WEBTRANSPORT_STREAM_BATCH_BYTES=65536 \
            BENCH_G_CELLS="G-batch,G-window-batch" \
            BENCH_OUT="$EV/bench-stream-g5-knobon-$SHA.json" \
            bun tools/load/bench-stream.ts
          echo "::endgroup::"

          GATE_G5_OUT="$EV/bench-stream-g5-verdict-$SHA.json" \
            bun tools/load/gate-g5-verdict.ts \
              "$EV/bench-stream-g5-knoboff-$SHA.json" \
              "$EV/bench-stream-g5-knobon-$SHA.json"

          # Every artifact hashed in the log, so the run log's sha256 column is
          # filled from the run rather than from a later local re-read.
          sha256sum "$EV"/bench-stream-g5-*.json
      # Gate G5b — the paced gate. Pre-registration:
      # docs/research/preregistrations/gate-g5b.md
      #
      # Gate G5's unpaced arm outran the rig and returned NO-VERDICT via the
      # axis's host-saturation STOP. This arm holds the client at a registered
      # 1.25 Gbps offer, so the question is whether the config sustains the bar
      # rather than how fast it can go. Same no-tunable-inputs rule as gate-g5:
      # the pace point, the cells and the batch budget live in the committed
      # harness.
      - name: Run gate G5b (paced)
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.mode == 'gate-g5b' }}
        env:
          WEBTRANSPORT_STREAM_BATCH_DIAGNOSTICS: "1"
          BENCH_STREAM_ARMS: P
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.bench-evidence"
          EV="$GITHUB_WORKSPACE/.bench-evidence"
          SHA="${{ github.event.inputs.candidate_commit }}"

          echo "::group::G5b invocation 1 — knob OFF (P-control, P-window-ref, A6-shipped, A6-raised)"
          BENCH_P_CELLS="P-control,P-window-ref,A6-shipped,A6-raised" \
            BENCH_OUT="$EV/bench-stream-g5b-knoboff-$SHA.json" \
            bun tools/load/bench-stream.ts
          echo "::endgroup::"

          echo "::group::G5b invocation 2 — knob ON at 65536 (P-batch)"
          WEBTRANSPORT_STREAM_BATCH_BYTES=65536 \
            BENCH_P_CELLS="P-batch" \
            BENCH_OUT="$EV/bench-stream-g5b-knobon-$SHA.json" \
            bun tools/load/bench-stream.ts
          echo "::endgroup::"

          GATE_G5B_OUT="$EV/bench-stream-g5b-verdict-$SHA.json" \
            bun tools/load/gate-g5b-verdict.ts \
              "$EV/bench-stream-g5b-knoboff-$SHA.json" \
              "$EV/bench-stream-g5b-knobon-$SHA.json"

          sha256sum "$EV"/bench-stream-g5b-*.json
      # Gate G11 — bidirectional tunnels. Pre-registration:
      # docs/research/preregistrations/gate-g11-bidi.md
      #
      # Populations and windows are inputs; no threshold is. Two invocations,
      # because WEBTRANSPORT_STREAM_BATCH_BYTES is read once per process and a
      # cell whose knob state is not what its label says is what V-K rejects:
      #
      #   1. knob OFF — the gate cell T-100 (x2) and every ladder, acceptance
      #      and coupling cell. This invocation is the one that stamps.
      #   2. knob ON at 65536 — T-100-batch and J-batch, both verdict-free
      #      disclosure cells (C9 grades nothing).
      - name: Run gate G11 (bidirectional tunnels)
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.mode == 'g11-bidi' }}
        env:
          WEBTRANSPORT_STREAM_BATCH_DIAGNOSTICS: "1"
          G11_ARMS: ${{ github.event.inputs.g11_arms }}
          G11_STEP_SECONDS: ${{ github.event.inputs.g11_step_seconds }}
          G11_EXCHANGE_STEP_SECONDS: ${{ github.event.inputs.g11_exchange_step_seconds }}
          G11_COUPLING_STEP_SECONDS: ${{ github.event.inputs.g11_coupling_step_seconds }}
          G11_REPEATS: ${{ github.event.inputs.g11_repeats }}
          G11_GENERATOR: ${{ github.event.inputs.g11_generator }}
        run: |
          set -euo pipefail

          # One consolidated generator input (the workflow_dispatch 25-input
          # cap is already at the wall). Parsed and EXPORTED here so both
          # invocations — knob-off and knob-on — see the same choice; the
          # conductor treats an empty value as the default (js / auto). An
          # unknown key fails the dispatch rather than silently running the
          # defaults a typo did not ask for.
          G11_DOWN_ORIGINATOR=""
          G11_DEFRAME_WORKERS=""
          if [ -n "${G11_GENERATOR:-}" ]; then
            IFS=',' read -ra GEN_PAIRS <<< "$G11_GENERATOR"
            for pair in "${GEN_PAIRS[@]}"; do
              key="${pair%%=*}"
              value="${pair#*=}"
              if [ "$key" = "$pair" ] || [ -z "$value" ]; then
                echo "::error::g11_generator entry '$pair' is not key=value"
                exit 1
              fi
              case "$key" in
                originator) G11_DOWN_ORIGINATOR="$value" ;;
                deframe) G11_DEFRAME_WORKERS="$value" ;;
                *)
                  echo "::error::g11_generator key '$key' unknown (allowed: originator, deframe)"
                  exit 1
                  ;;
              esac
            done
          fi
          export G11_DOWN_ORIGINATOR G11_DEFRAME_WORKERS
          echo "g11 generator: originator='${G11_DOWN_ORIGINATOR:-js (default)}' deframe='${G11_DEFRAME_WORKERS:-auto (default)}'"
          mkdir -p "$GITHUB_WORKSPACE/.bench-evidence"
          EV="$GITHUB_WORKSPACE/.bench-evidence"
          SHA="${{ github.event.inputs.candidate_commit }}"
          RUN_ID="g11-$SHA-${{ github.run_id }}"

          echo "::group::G11 invocation 1 — knob OFF (the gate cell and every ladder)"
          G11_RUN_ID="$RUN_ID" \
            G11_CANDIDATE_SHA="$SHA" \
            G11_STAGING_BASE_SHA="$(git merge-base HEAD origin/rebind4-staging 2>/dev/null || echo unknown)" \
            G11_CELLS="${{ github.event.inputs.g11_cells }}" \
            G11_OUT="$EV/bench-g11-knoboff-$SHA.json" \
            bun tools/load/bench-g11.ts
          echo "::endgroup::"

          # Invocation 2 is the knob-ON disclosure run (C9 grades nothing). Its
          # cell list used to be hardcoded, so a dispatch narrowed to the T
          # ladder still ran J-batch — one of the shapes that hung in run
          # 32291972328. The default is unchanged, so an unchanged dispatch
          # behaves as before; emptying the input skips the invocation, which
          # Amendment 7 requires the dispatcher to name in the §12 entry.
          G11_CELLS_KNOBON="${{ github.event.inputs.g11_cells_knobon }}"
          if [ -n "$G11_CELLS_KNOBON" ]; then
            echo "::group::G11 invocation 2 — knob ON at 65536 ($G11_CELLS_KNOBON; verdict-free)"
            WEBTRANSPORT_STREAM_BATCH_BYTES=65536 \
              G11_RUN_ID="$RUN_ID" \
              G11_CANDIDATE_SHA="$SHA" \
              G11_CELLS="$G11_CELLS_KNOBON" \
              G11_SKIP_BUILD=1 \
              G11_BASE_PORT=4620 \
              G11_OUT="$EV/bench-g11-knobon-$SHA.json" \
              bun tools/load/bench-g11.ts
            echo "::endgroup::"
          else
            echo "G11 invocation 2 skipped (g11_cells_knobon empty) — this run carries NO knob-ON disclosure cells"
          fi

          sha256sum "$EV"/bench-g11-*.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && github.event.inputs.probe_only != 'true' }}
        with:
          name: bench-bandwidth-${{ github.event.inputs.candidate_commit }}
          path: .bench-evidence/bench-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
