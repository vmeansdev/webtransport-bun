# Bandwidth saturation ladder on the heavy self-hosted runner. Measurement
# only — locates where a host saturates (CPU%, memory vs aggregate Mbps); it
# is not a release gate. Trigger manually via workflow_dispatch.
name: bench-bandwidth
on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: "Exact commit SHA to benchmark"
        required: true
        type: string
      sessions:
        description: "Concurrent sessions held for every ladder step"
        required: false
        default: "100"
        type: string
      payload_bytes:
        description: "Datagram payload size in bytes (MTU-ish for video-style framing)"
        required: false
        default: "1150"
        type: string
      step_seconds:
        description: "Seconds to hold each ladder step"
        required: false
        default: "180"
        type: string
      rates:
        description: "Comma-separated per-session datagrams/s ladder"
        required: false
        default: "27,54,109,217,326,435"
        type: string
      probe_only:
        description: "Run only the GSO/GRO host probe, skip the ladder"
        required: false
        default: "false"
        type: string
      sink_gate:
        description: "Run the stream sink latency gate (RFC_STREAM_SINK) instead of the ladder"
        required: false
        default: "false"
        type: string
      sink_saturate_pct:
        description: "Receiver-loop saturation duty for the sink gate's loaded cell"
        required: false
        default: "90"
        type: string
      sink_soak_seconds:
        description: "Also run the sink churn soak for this many seconds (0 skips; 86400 is the 24h gate)"
        required: false
        default: "0"
        type: string
      runner_label:
        description: "Self-hosted runner pool (soak for day-long sink soaks, heavy otherwise)"
        required: false
        default: "heavy"
        type: choice
        options:
          - "heavy"
          - "soak"
jobs:
  bench:
    permissions:
      contents: read
    runs-on: ${{ fromJson(github.event.inputs.runner_label == 'soak' && '["self-hosted","Linux","X64","soak"]' || '["self-hosted","Linux","X64","heavy"]') }}
    timeout-minutes: ${{ (github.event.inputs.sink_soak_seconds != '0' && github.event.inputs.sink_soak_seconds != '') && 1560 || 120 }}
    concurrency:
      group: bench-bandwidth
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.candidate_commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-07-22
        with:
          node-version: "22.23.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: GSO/GRO host probe
        if: ${{ github.event.inputs.probe_only == 'true' }}
        run: |
          echo "== kernel =="
          uname -a
          IFACE="$(ip route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<NF;i++) if($i=="dev") print $(i+1)}' | head -1)"
          echo "iface=$IFACE"
          if command -v ethtool >/dev/null 2>&1 && [ -n "$IFACE" ]; then
            echo "== driver =="
            ethtool -i "$IFACE" || true
            echo "== offload features (udp/gso/gro) =="
            ethtool -k "$IFACE" | grep -Ei 'udp|gso|gro|segmentation' || true
          else
            echo "ethtool unavailable or iface not found; skipping feature dump"
          fi
          cargo run --release -p reference --bin gso-probe
      - name: Install deps
        if: ${{ github.event.inputs.probe_only != 'true' }}
        run: bun install --frozen-lockfile
      - name: Select supported C/C++ compiler
        run: |
          if command -v clang >/dev/null 2>&1 && command -v clang++ >/dev/null 2>&1; then
            echo "CC=$(realpath "$(command -v clang)")" >> "$GITHUB_ENV"
            echo "CXX=$(realpath "$(command -v clang++)")" >> "$GITHUB_ENV"
            echo "Selected resolved clang/clang++ paths"
            exit 0
          fi

          for v in 12 11 10; do
            if command -v "gcc-$v" >/dev/null 2>&1 && command -v "g++-$v" >/dev/null 2>&1; then
              echo "CC=$(realpath "$(command -v "gcc-$v")")" >> "$GITHUB_ENV"
              echo "CXX=$(realpath "$(command -v "g++-$v")")" >> "$GITHUB_ENV"
              echo "Selected resolved gcc-$v/g++-$v paths"
              exit 0
            fi
          done

          echo "::error::No supported compiler found. Install clang (preferred) or gcc-10+ on this self-hosted runner."
          exit 1
      - name: Build native addon
        if: ${{ github.event.inputs.probe_only != 'true' }}
        run: bun run build:native
      - name: Profile runner capacity
        run: |
          CPUS="$(nproc 2>/dev/null || echo 1)"
          MEM_KB="$(awk '/MemTotal/ {print $2}' /proc/meminfo 2>/dev/null || echo 0)"
          echo "Runner: cpu=$CPUS mem=$((MEM_KB / 1024))MB"
      - name: Sink latency gate
        if: ${{ github.event.inputs.sink_gate == 'true' }}
        env:
          WEBTRANSPORT_SUPPRESS_INSECURE_SKIP_VERIFY_WARN: "1"
          SINK_SAT: ${{ github.event.inputs.sink_saturate_pct }}
          CANDIDATE: ${{ github.event.inputs.candidate_commit }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.bench-evidence"
          IDLE_JSON="$GITHUB_WORKSPACE/.bench-evidence/bench-sink-idle-$CANDIDATE.json"
          SAT_JSON="$GITHUB_WORKSPACE/.bench-evidence/bench-sink-sat$SINK_SAT-$CANDIDATE.json"
          SINK_BENCH_DURATION_S=30 SINK_BENCH_SATURATE_PCT=0 \
            SINK_BENCH_JSON="$IDLE_JSON" bun tools/load/bench-sink.ts
          SINK_BENCH_DURATION_S=30 SINK_BENCH_SATURATE_PCT="$SINK_SAT" \
            SINK_BENCH_JSON="$SAT_JSON" bun tools/load/bench-sink.ts
          IDLE_JSON="$IDLE_JSON" SAT_JSON="$SAT_JSON" bun scripts/check-sink-gate.ts
      - name: Sink churn soak
        if: ${{ github.event.inputs.sink_gate == 'true' && github.event.inputs.sink_soak_seconds != '0' }}
        env:
          WEBTRANSPORT_SUPPRESS_INSECURE_SKIP_VERIFY_WARN: "1"
          SOAK_SINK_DURATION: ${{ github.event.inputs.sink_soak_seconds }}
          SOAK_SINK_JSON: .bench-evidence/soak-sink-${{ github.event.inputs.candidate_commit }}.json
        run: bun tools/load/soak-sink.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && github.event.inputs.sink_gate == 'true' }}
        with:
          name: sink-gate-${{ github.event.inputs.candidate_commit }}-${{ github.run_id }}
          path: |
            .bench-evidence/bench-sink-*
            .bench-evidence/soak-sink-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Run bandwidth ladder
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.sink_gate != 'true' }}
        env:
          BENCH_SESSIONS: ${{ github.event.inputs.sessions }}
          BENCH_PAYLOAD_BYTES: ${{ github.event.inputs.payload_bytes }}
          BENCH_STEP_SECONDS: ${{ github.event.inputs.step_seconds }}
          BENCH_RATES: ${{ github.event.inputs.rates }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.bench-evidence"
          BENCH_OUT="$GITHUB_WORKSPACE/.bench-evidence/bench-bandwidth-${{ github.event.inputs.candidate_commit }}.json" \
            bun tools/load/bench-bandwidth.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && github.event.inputs.probe_only != 'true' && github.event.inputs.sink_gate != 'true' }}
        with:
          name: bench-bandwidth-${{ github.event.inputs.candidate_commit }}
          path: .bench-evidence/bench-bandwidth-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
