# Bandwidth saturation ladder on the heavy self-hosted runner. Measurement
# only — locates where a host saturates (CPU%, memory vs aggregate Mbps); it
# is not a release gate. Trigger manually via workflow_dispatch.
name: bench-bandwidth
on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: "Exact commit SHA to benchmark"
        required: true
        type: string
      sessions:
        description: "Concurrent sessions held for every ladder step"
        required: false
        default: "100"
        type: string
      payload_bytes:
        description: "Datagram payload size in bytes (MTU-ish for video-style framing)"
        required: false
        default: "1150"
        type: string
      step_seconds:
        description: "Seconds to hold each ladder step"
        required: false
        default: "180"
        type: string
      rates:
        description: "Comma-separated per-session datagrams/s ladder"
        required: false
        default: "27,54,109,217,326,435"
        type: string
      probe_only:
        description: "Run only the GSO/GRO host probe, skip the ladder"
        required: false
        default: "false"
        type: string
      mode:
        description: "bandwidth (rate ladder, default) | session-scale (session-count ladder) | sink-gate (RFC_STREAM_SINK latency gate, optional churn soak; tuned by sink_params)"
        required: false
        default: "bandwidth"
        type: string
      scale_sessions:
        description: "session-scale: comma-separated session-count ladder"
        required: false
        default: "100,1000,5000,10000,25000,50000"
        type: string
      scale_interval_ms:
        description: "session-scale: per-session datagram interval in ms (5000 = 0.2/s)"
        required: false
        default: "5000"
        type: string
      scale_payload_bytes:
        description: "session-scale: datagram payload size in bytes"
        required: false
        default: "100"
        type: string
      scale_steady_seconds:
        description: "session-scale: steady-state hold per rung"
        required: false
        default: "120"
        type: string
      scale_idle_seconds:
        description: "session-scale: idle tail per rung (isolates idle per-session cost)"
        required: false
        default: "30"
        type: string
      scale_endpoints:
        description: "session-scale: client endpoints, one distinct 127.0.k.1 source IP each"
        required: false
        default: "64"
        type: string
      scale_connect_concurrency:
        description: "session-scale: concurrent handshakes in flight from the client"
        required: false
        default: "500"
        type: string
      scale_stagger:
        description: "session-scale: spread each session's send schedule over one interval (gate G1's registered arrival process)"
        required: false
        default: "false"
        type: string
      # The sink gate's three knobs share one JSON input because GitHub refuses
      # to parse a workflow with more than 25 dispatch inputs. Any omitted key takes the default shown; unknown keys and
      # out-of-range values are refused in "Validate benchmark mode".
      sink_params:
        description: 'sink-gate: JSON {"saturatePct":90,"soakSeconds":0,"runnerLabel":"heavy"}. saturatePct = receiver-loop saturation duty for the loaded cell; soakSeconds > 0 also runs the churn soak (86400 is the 24h gate); runnerLabel heavy|soak picks the self-hosted pool'
        required: false
        default: '{"saturatePct":90,"soakSeconds":0,"runnerLabel":"heavy"}'
        type: string
jobs:
  bench:
    permissions:
      contents: read
    runs-on: ${{ fromJson(fromJson(github.event.inputs.sink_params || '{}').runnerLabel == 'soak' && '["self-hosted","Linux","X64","soak"]' || '["self-hosted","Linux","X64","heavy"]') }}
    # The 24h sink churn soak needs a day plus margin; everything else fits 180.
    timeout-minutes: ${{ (github.event.inputs.mode == 'sink-gate' && fromJson(github.event.inputs.sink_params || '{}').soakSeconds && format('{0}', fromJson(github.event.inputs.sink_params || '{}').soakSeconds) != '0') && 1560 || 180 }}
    concurrency:
      group: bench-bandwidth
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.candidate_commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-07-22
        with:
          node-version: "22.23.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: GSO/GRO host probe
        if: ${{ github.event.inputs.probe_only == 'true' }}
        run: |
          echo "== kernel =="
          uname -a
          IFACE="$(ip route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<NF;i++) if($i=="dev") print $(i+1)}' | head -1)"
          echo "iface=$IFACE"
          if command -v ethtool >/dev/null 2>&1 && [ -n "$IFACE" ]; then
            echo "== driver =="
            ethtool -i "$IFACE" || true
            echo "== offload features (udp/gso/gro) =="
            ethtool -k "$IFACE" | grep -Ei 'udp|gso|gro|segmentation' || true
          else
            echo "ethtool unavailable or iface not found; skipping feature dump"
          fi
          cargo run --release -p reference --bin gso-probe
      - name: Install deps
        if: ${{ github.event.inputs.probe_only != 'true' }}
        run: bun install --frozen-lockfile
      - name: Select supported C/C++ compiler
        run: |
          if command -v clang >/dev/null 2>&1 && command -v clang++ >/dev/null 2>&1; then
            echo "CC=$(realpath "$(command -v clang)")" >> "$GITHUB_ENV"
            echo "CXX=$(realpath "$(command -v clang++)")" >> "$GITHUB_ENV"
            echo "Selected resolved clang/clang++ paths"
            exit 0
          fi

          for v in 12 11 10; do
            if command -v "gcc-$v" >/dev/null 2>&1 && command -v "g++-$v" >/dev/null 2>&1; then
              echo "CC=$(realpath "$(command -v "gcc-$v")")" >> "$GITHUB_ENV"
              echo "CXX=$(realpath "$(command -v "g++-$v")")" >> "$GITHUB_ENV"
              echo "Selected resolved gcc-$v/g++-$v paths"
              exit 0
            fi
          done

          echo "::error::No supported compiler found. Install clang (preferred) or gcc-10+ on this self-hosted runner."
          exit 1
      - name: Build native addon
        if: ${{ github.event.inputs.probe_only != 'true' }}
        run: bun run build:native
      - name: Profile runner capacity
        run: |
          CPUS="$(nproc 2>/dev/null || echo 1)"
          MEM_KB="$(awk '/MemTotal/ {print $2}' /proc/meminfo 2>/dev/null || echo 0)"
          echo "Runner: cpu=$CPUS mem=$((MEM_KB / 1024))MB"
      - name: Validate benchmark mode
        if: ${{ github.event.inputs.probe_only != 'true' }}
        env:
          MODE: ${{ github.event.inputs.mode }}
          SINK_PARAMS: ${{ github.event.inputs.sink_params }}
        run: |
          case "$MODE" in
            sink-gate|bandwidth|session-scale) ;;
            *) echo "::error::Unsupported benchmark mode: $MODE"; exit 2 ;;
          esac
          if [ "$MODE" = "sink-gate" ]; then
            SINK_PARAMS="$SINK_PARAMS" bun -e '
              const raw = process.env.SINK_PARAMS || "{}";
              let p;
              try { p = JSON.parse(raw); } catch { console.error("::error::sink_params is not JSON"); process.exit(2); }
              if (p === null || typeof p !== "object" || Array.isArray(p)) { console.error("::error::sink_params must be a JSON object"); process.exit(2); }
              const allowed = new Set(["saturatePct", "soakSeconds", "runnerLabel"]);
              for (const k of Object.keys(p)) if (!allowed.has(k)) { console.error(`::error::sink_params: unknown key ${k}`); process.exit(2); }
              const sat = Number(p.saturatePct ?? 90);
              const soak = Number(p.soakSeconds ?? 0);
              const label = p.runnerLabel ?? "heavy";
              if (!Number.isInteger(sat) || sat < 0 || sat > 100) { console.error("::error::sink_params.saturatePct must be an integer 0..100"); process.exit(2); }
              if (!Number.isInteger(soak) || soak < 0) { console.error("::error::sink_params.soakSeconds must be a non-negative integer"); process.exit(2); }
              if (label !== "heavy" && label !== "soak") { console.error("::error::sink_params.runnerLabel must be heavy or soak"); process.exit(2); }
              console.log(`sink-gate: saturatePct=${sat} soakSeconds=${soak} runnerLabel=${label}`);
            '
          fi
      - name: Sink latency gate
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.mode == 'sink-gate' }}
        env:
          WEBTRANSPORT_SUPPRESS_INSECURE_SKIP_VERIFY_WARN: "1"
          SINK_SAT: ${{ fromJson(github.event.inputs.sink_params || '{}').saturatePct || '90' }}
          CANDIDATE: ${{ github.event.inputs.candidate_commit }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.bench-evidence"
          IDLE_JSON="$GITHUB_WORKSPACE/.bench-evidence/bench-sink-idle-$CANDIDATE.json"
          SAT_JSON="$GITHUB_WORKSPACE/.bench-evidence/bench-sink-sat$SINK_SAT-$CANDIDATE.json"
          SINK_BENCH_DURATION_S=30 SINK_BENCH_SATURATE_PCT=0 \
            SINK_BENCH_JSON="$IDLE_JSON" bun tools/load/bench-sink.ts
          SINK_BENCH_DURATION_S=30 SINK_BENCH_SATURATE_PCT="$SINK_SAT" \
            SINK_BENCH_JSON="$SAT_JSON" bun tools/load/bench-sink.ts
          IDLE_JSON="$IDLE_JSON" SAT_JSON="$SAT_JSON" bun scripts/check-sink-gate.ts
      - name: Sink churn soak
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.mode == 'sink-gate' && fromJson(github.event.inputs.sink_params || '{}').soakSeconds && format('{0}', fromJson(github.event.inputs.sink_params || '{}').soakSeconds) != '0' }}
        env:
          WEBTRANSPORT_SUPPRESS_INSECURE_SKIP_VERIFY_WARN: "1"
          SOAK_SINK_DURATION: ${{ fromJson(github.event.inputs.sink_params || '{}').soakSeconds }}
          SOAK_SINK_JSON: .bench-evidence/soak-sink-${{ github.event.inputs.candidate_commit }}.json
        run: bun tools/load/soak-sink.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && github.event.inputs.probe_only != 'true' && github.event.inputs.mode == 'sink-gate' }}
        with:
          name: sink-gate-${{ github.event.inputs.candidate_commit }}-${{ github.run_id }}
          path: |
            .bench-evidence/bench-sink-*
            .bench-evidence/soak-sink-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Run bandwidth ladder
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.mode == 'bandwidth' }}
        env:
          BENCH_SESSIONS: ${{ github.event.inputs.sessions }}
          BENCH_PAYLOAD_BYTES: ${{ github.event.inputs.payload_bytes }}
          BENCH_STEP_SECONDS: ${{ github.event.inputs.step_seconds }}
          BENCH_RATES: ${{ github.event.inputs.rates }}
          CANDIDATE: ${{ github.event.inputs.candidate_commit }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.bench-evidence"
          BENCH_OUT="$GITHUB_WORKSPACE/.bench-evidence/bench-bandwidth-$CANDIDATE.json" \
            bun tools/load/bench-bandwidth.ts
      # Session-count ladder: session count is the only variable, per-session
      # rate is held deliberately low. Buckets and STOP conditions were
      # pre-registered with the session-scale campaign (kept outside the repo).
      - name: Run session-scale ladder
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.mode == 'session-scale' }}
        env:
          SCALE_SESSIONS: ${{ github.event.inputs.scale_sessions }}
          SCALE_INTERVAL_MS: ${{ github.event.inputs.scale_interval_ms }}
          SCALE_PAYLOAD_BYTES: ${{ github.event.inputs.scale_payload_bytes }}
          SCALE_STEADY_SECONDS: ${{ github.event.inputs.scale_steady_seconds }}
          SCALE_IDLE_SECONDS: ${{ github.event.inputs.scale_idle_seconds }}
          SCALE_ENDPOINTS: ${{ github.event.inputs.scale_endpoints }}
          SCALE_CONNECT_CONCURRENCY: ${{ github.event.inputs.scale_connect_concurrency }}
          SCALE_STAGGER: ${{ github.event.inputs.scale_stagger }}
          CANDIDATE: ${{ github.event.inputs.candidate_commit }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.bench-evidence"
          # Raise the fd soft limit to the hard limit. The pre-registration
          # expects fd count to be flat in session count (shared QUIC
          # endpoints); this makes sure a low soft limit cannot masquerade
          # as a server-side wall if it is not.
          ulimit -n "$(ulimit -Hn)" || true
          echo "fd soft limit: $(ulimit -n)"
          SCALE_OUT="$GITHUB_WORKSPACE/.bench-evidence/bench-session-scale-$CANDIDATE.json" \
            bun tools/load/bench-session-scale.ts
      - name: Upload legacy benchmark artifacts
        if: ${{ always() && github.event.inputs.probe_only != 'true' && (github.event.inputs.mode == 'bandwidth' || github.event.inputs.mode == 'session-scale') }}
        with:
          name: bench-bandwidth-${{ github.event.inputs.candidate_commit }}
          path: |
            .bench-evidence/bench-bandwidth-*
            .bench-evidence/bench-session-scale-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
