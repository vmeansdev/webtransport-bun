# Bandwidth saturation ladder on the heavy self-hosted runner. Measurement
# only — locates where a host saturates (CPU%, memory vs aggregate Mbps); it
# is not a release gate. Trigger manually via workflow_dispatch.
name: bench-bandwidth
on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: "Exact commit SHA to benchmark"
        required: true
        type: string
      sessions:
        description: "Concurrent sessions held for every ladder step"
        required: false
        default: "100"
        type: string
      payload_bytes:
        description: "Datagram payload size in bytes (MTU-ish for video-style framing)"
        required: false
        default: "1150"
        type: string
      step_seconds:
        description: "Seconds to hold each ladder step"
        required: false
        default: "180"
        type: string
      rates:
        description: "Comma-separated per-session datagrams/s ladder"
        required: false
        default: "27,54,109,217,326,435"
        type: string
      probe_only:
        description: "Run only the GSO/GRO host probe, skip the ladder"
        required: false
        default: "false"
        type: string
      mode:
        description: "bandwidth (rate ladder, default) | session-scale (session-count ladder) | g6-mmo (MMO realm gate) | g6-attribution (same-workload attribution) | ack-reflector-gate (one shard, 1,250 sessions, js vs native ack reflection)"
        required: false
        default: "bandwidth"
        type: string
      scale_sessions:
        description: "session-scale: comma-separated session-count ladder"
        required: false
        default: "100,1000,5000,10000,25000,50000"
        type: string
      scale_interval_ms:
        description: "session-scale: per-session datagram interval in ms (5000 = 0.2/s)"
        required: false
        default: "5000"
        type: string
      scale_payload_bytes:
        description: "session-scale: datagram payload size in bytes"
        required: false
        default: "100"
        type: string
      scale_steady_seconds:
        description: "session-scale: steady-state hold per rung"
        required: false
        default: "120"
        type: string
      scale_idle_seconds:
        description: "session-scale: idle tail per rung (isolates idle per-session cost)"
        required: false
        default: "30"
        type: string
      scale_endpoints:
        description: "session-scale: client endpoints, one distinct 127.0.k.1 source IP each"
        required: false
        default: "64"
        type: string
      scale_connect_concurrency:
        description: "session-scale: concurrent handshakes in flight from the client"
        required: false
        default: "500"
        type: string
      scale_stagger:
        description: "session-scale: spread each session's send schedule over one interval (gate G1's registered arrival process)"
        required: false
        default: "false"
        type: string
      g6_arms:
        description: "g6-mmo: arms to run (steady,hotspot,storm). Every rate is derived in tools/load/g6-plan.ts, not here."
        required: false
        default: "steady,hotspot,storm"
        type: string
      g6_ladder:
        description: "g6-mmo: realm population ladder. The gate rung is the last one."
        required: false
        default: "500,2500,5000"
        type: string
      g6_steady_seconds:
        description: "g6-mmo: steady window per arm"
        required: false
        default: "120"
        type: string
      g6_offbox_ssh:
        description: "g6-mmo: ssh destination of the Mac generator over the cable. EMPTY MEANS CO-RESIDENT, which can never be a G6 result."
        required: false
        default: ""
        type: string
      g6_server_address:
        description: "g6 modes: the server's address on the bench subnet, as the off-box generator dials it"
        required: false
        default: "10.99.0.2"
        type: string
      g6_preregistration_sha256:
        description: "g6 modes: exact SHA-256 of the tracked successor preregistration"
        required: false
        default: ""
        type: string
      # GitHub refuses to parse a workflow with more than 25 dispatch inputs,
      # so the twelve source-bound values ride in one JSON blob. It is decoded
      # and fail-closed-validated by tools/load/g6-source-bound.ts before the
      # configure step exports anything.
      g6_source_bound:
        description: "g6 modes: JSON with registrationPath/registrationSha256/expectedRunnerHost/expectedGeneratorHost, plus for g6-mmo the same-day preflightDown/preflightUp/floor/sink Path+Sha256 pairs (absolute runner paths)"
        required: false
        default: ""
        type: string
jobs:
  bench:
    permissions:
      contents: read
    runs-on: ["self-hosted", "Linux", "X64", "heavy"]
    timeout-minutes: 180
    concurrency:
      group: bench-bandwidth
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.candidate_commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-07-22
        with:
          node-version: "22.23.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: GSO/GRO host probe
        if: ${{ github.event.inputs.probe_only == 'true' }}
        run: |
          echo "== kernel =="
          uname -a
          IFACE="$(ip route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<NF;i++) if($i=="dev") print $(i+1)}' | head -1)"
          echo "iface=$IFACE"
          if command -v ethtool >/dev/null 2>&1 && [ -n "$IFACE" ]; then
            echo "== driver =="
            ethtool -i "$IFACE" || true
            echo "== offload features (udp/gso/gro) =="
            ethtool -k "$IFACE" | grep -Ei 'udp|gso|gro|segmentation' || true
          else
            echo "ethtool unavailable or iface not found; skipping feature dump"
          fi
          cargo run --release -p reference --bin gso-probe
      - name: Install deps
        if: ${{ github.event.inputs.probe_only != 'true' }}
        run: bun install --frozen-lockfile
      - name: Select supported C/C++ compiler
        run: |
          if command -v clang >/dev/null 2>&1 && command -v clang++ >/dev/null 2>&1; then
            echo "CC=$(realpath "$(command -v clang)")" >> "$GITHUB_ENV"
            echo "CXX=$(realpath "$(command -v clang++)")" >> "$GITHUB_ENV"
            echo "Selected resolved clang/clang++ paths"
            exit 0
          fi

          for v in 12 11 10; do
            if command -v "gcc-$v" >/dev/null 2>&1 && command -v "g++-$v" >/dev/null 2>&1; then
              echo "CC=$(realpath "$(command -v "gcc-$v")")" >> "$GITHUB_ENV"
              echo "CXX=$(realpath "$(command -v "g++-$v")")" >> "$GITHUB_ENV"
              echo "Selected resolved gcc-$v/g++-$v paths"
              exit 0
            fi
          done

          echo "::error::No supported compiler found. Install clang (preferred) or gcc-10+ on this self-hosted runner."
          exit 1
      - name: Build native addon
        if: ${{ github.event.inputs.probe_only != 'true' }}
        run: bun run build:native
      - name: Profile runner capacity
        run: |
          CPUS="$(nproc 2>/dev/null || echo 1)"
          MEM_KB="$(awk '/MemTotal/ {print $2}' /proc/meminfo 2>/dev/null || echo 0)"
          echo "Runner: cpu=$CPUS mem=$((MEM_KB / 1024))MB"
      - name: Validate benchmark mode
        if: ${{ github.event.inputs.probe_only != 'true' }}
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          case "$MODE" in
            bandwidth|session-scale|g6-mmo|g6-attribution|ack-reflector-gate) ;;
            *) echo "::error::Unsupported benchmark mode: $MODE"; exit 2 ;;
          esac
      - name: Configure successor evidence bundle
        id: configure_g6_bundle
        if: ${{ github.event.inputs.probe_only != 'true' && (github.event.inputs.mode == 'g6-mmo' || github.event.inputs.mode == 'g6-attribution' || github.event.inputs.mode == 'ack-reflector-gate') }}
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_commit }}
          MODE: ${{ github.event.inputs.mode }}
          OFFBOX_SSH: ${{ github.event.inputs.g6_offbox_ssh }}
          PREREGISTRATION_SHA256: ${{ github.event.inputs.g6_preregistration_sha256 }}
          SOURCE_BOUND: ${{ github.event.inputs.g6_source_bound }}
        run: |
          # Every identity check runs before anything is exported to
          # GITHUB_ENV. Later always() steps predicate on these exports, so a
          # refused configuration must leave them unset.
          for value in "$OFFBOX_SSH" "$PREREGISTRATION_SHA256" "$SOURCE_BOUND"; do
            if [ -z "$value" ]; then
              echo "::error::The off-box, preregistration, and source-bound inputs are all required"
              exit 2
            fi
          done
          # The validator emits only allowlisted KEY=value lines (no shell
          # metacharacters) to a temp file. We never eval its output — a value
          # can carry no code. The one field an in-step refusal needs (the
          # expected runner host) is read back with grep, not eval, and the
          # whole file is appended to GITHUB_ENV only after the last refusal.
          PARSED_FILE="$RUNNER_TEMP/g6-source-bound-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.env"
          if ! G6_SOURCE_BOUND="$SOURCE_BOUND" G6_MODE="$MODE" bun tools/load/g6-source-bound.ts > "$PARSED_FILE"; then
            echo "::error::source-bound input rejected"
            exit 2
          fi
          EXPECTED_RUNNER_HOST="$(grep '^G6_EXPECTED_RUNNER_HOST=' "$PARSED_FILE" | cut -d= -f2-)"
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          if [ "$ACTUAL_HEAD" != "$CANDIDATE_SHA" ]; then
            echo "::error::Checked-out HEAD $ACTUAL_HEAD differs from registered candidate $CANDIDATE_SHA"
            exit 2
          fi
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::Tracked candidate tree is dirty"
            exit 2
          fi
          ACTUAL_RUNNER_HOST="$(hostname -s)"
          if [ "$ACTUAL_RUNNER_HOST" != "$EXPECTED_RUNNER_HOST" ]; then
            echo "::error::Runner host $ACTUAL_RUNNER_HOST differs from $EXPECTED_RUNNER_HOST"
            exit 2
          fi
          mkdir -p "$GITHUB_WORKSPACE/.bench-evidence"
          BUNDLE_DIR="$GITHUB_WORKSPACE/.bench-evidence/g6-${MODE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          cat "$PARSED_FILE" >> "$GITHUB_ENV"
          echo "G6_BUNDLE_DIR=$BUNDLE_DIR" >> "$GITHUB_ENV"
          echo "G6_TREE_SHA=$TREE_SHA" >> "$GITHUB_ENV"
          echo "G6_RUN_EXIT=not-run" >> "$GITHUB_ENV"
          echo "G6_EVALUATOR_EXIT=not-run" >> "$GITHUB_ENV"
          echo "G6_FINALIZE_EXIT=not-run" >> "$GITHUB_ENV"
          echo "G6_VERIFY_EXIT=not-run" >> "$GITHUB_ENV"
          echo "G6_BUNDLE_STATUS=not-run" >> "$GITHUB_ENV"
          echo "G6_UPLOAD_FAILED=unknown" >> "$GITHUB_ENV"
          echo "G6_CONFIGURE_OK=true" >> "$GITHUB_ENV"
      - name: Prepare successor evidence bundle
        if: ${{ github.event.inputs.probe_only != 'true' && (github.event.inputs.mode == 'g6-mmo' || github.event.inputs.mode == 'g6-attribution' || github.event.inputs.mode == 'ack-reflector-gate') }}
        env:
          MODE: ${{ github.event.inputs.mode }}
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_commit }}
          PREREGISTRATION_SHA256: ${{ github.event.inputs.g6_preregistration_sha256 }}
        run: |
          KIND="attribution"
          if [ "$MODE" = "g6-mmo" ]; then KIND="full-g6"; fi
          COMMON=(
            --kind "$KIND"
            --dir "$G6_BUNDLE_DIR"
            --candidate "$CANDIDATE_SHA"
            --tree-sha "$G6_TREE_SHA"
            --preregistration "$GITHUB_WORKSPACE/docs/research/preregistrations/gate-g6-mmo-closeout.md"
            --expected-preregistration-sha256 "$PREREGISTRATION_SHA256"
            --registration "$G6_REGISTRATION_PATH"
            --expected-registration-sha256 "$G6_REGISTRATION_SHA256"
            --expected-runner-host "$G6_EXPECTED_RUNNER_HOST"
            --expected-generator-host "$G6_EXPECTED_GENERATOR_HOST"
          )
          if [ "$MODE" = "g6-mmo" ]; then
            bun tools/load/g6-bundle.ts prepare "${COMMON[@]}" \
              --preflight-down "$G6_PREFLIGHT_DOWN_PATH" \
              --expected-preflight-down-sha256 "$G6_PREFLIGHT_DOWN_SHA256" \
              --preflight-up "$G6_PREFLIGHT_UP_PATH" \
              --expected-preflight-up-sha256 "$G6_PREFLIGHT_UP_SHA256" \
              --floor "$G6_FLOOR_PATH" \
              --expected-floor-sha256 "$G6_FLOOR_SHA256" \
              --sink "$G6_SINK_PATH" \
              --expected-sink-sha256 "$G6_SINK_SHA256"
          else
            bun tools/load/g6-bundle.ts prepare "${COMMON[@]}"
          fi
          echo "G6_PREPARE_OK=true" >> "$GITHUB_ENV"
      - name: Run bandwidth ladder
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.mode == 'bandwidth' }}
        env:
          BENCH_SESSIONS: ${{ github.event.inputs.sessions }}
          BENCH_PAYLOAD_BYTES: ${{ github.event.inputs.payload_bytes }}
          BENCH_STEP_SECONDS: ${{ github.event.inputs.step_seconds }}
          BENCH_RATES: ${{ github.event.inputs.rates }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.bench-evidence"
          BENCH_OUT="$GITHUB_WORKSPACE/.bench-evidence/bench-bandwidth-${{ github.event.inputs.candidate_commit }}.json" \
            bun tools/load/bench-bandwidth.ts
      # Session-count ladder: session count is the only variable, per-session
      # rate is held deliberately low. Buckets and STOP conditions are
      # pre-registered in docs/research/preregistrations/session-scale.md.
      - name: Run session-scale ladder
        if: ${{ github.event.inputs.probe_only != 'true' && github.event.inputs.mode == 'session-scale' }}
        env:
          SCALE_SESSIONS: ${{ github.event.inputs.scale_sessions }}
          SCALE_INTERVAL_MS: ${{ github.event.inputs.scale_interval_ms }}
          SCALE_PAYLOAD_BYTES: ${{ github.event.inputs.scale_payload_bytes }}
          SCALE_STEADY_SECONDS: ${{ github.event.inputs.scale_steady_seconds }}
          SCALE_IDLE_SECONDS: ${{ github.event.inputs.scale_idle_seconds }}
          SCALE_ENDPOINTS: ${{ github.event.inputs.scale_endpoints }}
          SCALE_CONNECT_CONCURRENCY: ${{ github.event.inputs.scale_connect_concurrency }}
          SCALE_STAGGER: ${{ github.event.inputs.scale_stagger }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.bench-evidence"
          # Raise the fd soft limit to the hard limit. The pre-registration
          # expects fd count to be flat in session count (shared QUIC
          # endpoints); this makes sure a low soft limit cannot masquerade
          # as a server-side wall if it is not.
          ulimit -n "$(ulimit -Hn)" || true
          echo "fd soft limit: $(ulimit -n)"
          SCALE_OUT="$GITHUB_WORKSPACE/.bench-evidence/bench-session-scale-${{ github.event.inputs.candidate_commit }}.json" \
            bun tools/load/bench-session-scale.ts
      # G6: the MMO realm gate. Rates, bounds and the cable STOP's requirements
      # are derived in tools/load/g6-plan.ts from the scenario constants, so the
      # workflow carries populations and windows and no thresholds at all.
      # Registration: docs/research/preregistrations/gate-g6-mmo.md.
      - name: Run G6 MMO realm gate
        id: run_g6_mmo
        if: ${{ always() && github.event.inputs.probe_only != 'true' && github.event.inputs.mode == 'g6-mmo' && env.G6_CONFIGURE_OK == 'true' && env.G6_PREPARE_OK == 'true' && env.G6_BUNDLE_DIR != '' }}
        continue-on-error: true
        env:
          G6_ARMS: ${{ github.event.inputs.g6_arms }}
          G6_LADDER: ${{ github.event.inputs.g6_ladder }}
          G6_STEADY_SECONDS: ${{ github.event.inputs.g6_steady_seconds }}
          G6_OFFBOX_SSH: ${{ github.event.inputs.g6_offbox_ssh }}
          G6_SERVER_ADDRESS: ${{ github.event.inputs.g6_server_address }}
          # The Mac entrypoint checks out and builds exactly this SHA; without
          # it every off-box generator spawn exits 3 before running (O-1).
          G6_CANDIDATE_SHA: ${{ github.event.inputs.candidate_commit }}
          # The bench-g6/2 producer refuses to run unless the tracked
          # preregistration hashes to exactly this value.
          G6_PREREGISTRATION_SHA256: ${{ github.event.inputs.g6_preregistration_sha256 }}
        run: |
          set +e
          ulimit -n "$(ulimit -Hn)" || true
          echo "fd soft limit: $(ulimit -n)"
          G6_OUT="$G6_BUNDLE_DIR/bench-g6.json" \
            bun tools/load/bench-g6.ts
          STATUS="$?"
          echo "G6_RUN_EXIT=$STATUS" >> "$GITHUB_ENV"
          exit "$STATUS"
      - name: Run G6 attribution matrix
        id: run_g6_attribution
        if: ${{ always() && github.event.inputs.probe_only != 'true' && github.event.inputs.mode == 'g6-attribution' && env.G6_CONFIGURE_OK == 'true' && env.G6_PREPARE_OK == 'true' && env.G6_BUNDLE_DIR != '' }}
        continue-on-error: true
        env:
          G6_ATTR_OUT_DIR: ${{ env.G6_BUNDLE_DIR }}
          G6_ATTR_OFFBOX_SSH: ${{ github.event.inputs.g6_offbox_ssh }}
          G6_ATTR_SERVER_ADDRESS: ${{ github.event.inputs.g6_server_address }}
          G6_ATTR_EXPECTED_GENERATOR_HOST: ${{ env.G6_EXPECTED_GENERATOR_HOST }}
        run: |
          set +e
          bun tools/load/g6-attribution-server.ts
          STATUS="$?"
          echo "G6_RUN_EXIT=$STATUS" >> "$GITHUB_ENV"
          exit "$STATUS"
      - name: Run ack reflector kill gate
        id: run_ack_reflector_gate
        if: ${{ always() && github.event.inputs.probe_only != 'true' && github.event.inputs.mode == 'ack-reflector-gate' && env.G6_CONFIGURE_OK == 'true' && env.G6_PREPARE_OK == 'true' && env.G6_BUNDLE_DIR != '' }}
        continue-on-error: true
        env:
          G6_OFFBOX_SSH: ${{ github.event.inputs.g6_offbox_ssh }}
          G6_SERVER_ADDRESS: ${{ github.event.inputs.g6_server_address }}
          G6_CANDIDATE_SHA: ${{ github.event.inputs.candidate_commit }}
          G6_PREREGISTRATION_SHA256: ${{ github.event.inputs.g6_preregistration_sha256 }}
        run: |
          set +e
          (
          set -euo pipefail
          ulimit -n "$(ulimit -Hn)" || true
          sudo env PIN_DIR=/sys/fs/bpf/quic-lb G6_BPF_READY_RECEIPT="$G6_BUNDLE_DIR/g6-shard-bpf-ready.json" tools/load/g6-shard-bpf-setup.sh 1
          for mode in js native; do
            sudo -E env SCAN_DIAGNOSTIC=1 SCAN_SHARDS=1 SCAN_SESSIONS=1250 SCAN_WORKLOAD_ACTIVE_SESSIONS=1250 \
              SCAN_ENDPOINTS=128 SCAN_CONNECT_CONCURRENCY=50 SCAN_CONNECT_RATE_PER_SEC=250 SCAN_FIXED_SOURCE_PORT_BASE=20000 \
              SCAN_ACK_REFLECTOR="$mode" G6_BPF_READY_RECEIPT="$G6_BUNDLE_DIR/g6-shard-bpf-ready.json" \
              SCAN_OUT="$G6_BUNDLE_DIR/ack-gate-$mode.json" SCAN_DIAGNOSTIC_OUT="$G6_BUNDLE_DIR/ack-gate-$mode-diagnostic.json" \
              SCAN_POST_RUN_STEERING_OUT="$G6_BUNDLE_DIR/ack-gate-$mode-steering.json" G6_EMITTER_MODE=native-mirror \
              bun tools/load/g6-sharded-scan.ts
          done
          bun tools/load/g6-ack-reflector-gate.ts --js "$G6_BUNDLE_DIR/ack-gate-js.json" --native "$G6_BUNDLE_DIR/ack-gate-native.json" --out "$G6_BUNDLE_DIR/ack-reflector-gate.json"
          )
          STATUS="$?"
          echo "G6_RUN_EXIT=$STATUS" >> "$GITHUB_ENV"
          exit "$STATUS"
      - name: Evaluate G6 MMO realm gate
        id: evaluate_g6_mmo
        if: ${{ always() && github.event.inputs.probe_only != 'true' && github.event.inputs.mode == 'g6-mmo' && env.G6_CONFIGURE_OK == 'true' && env.G6_PREPARE_OK == 'true' && env.G6_BUNDLE_DIR != '' }}
        continue-on-error: true
        env:
          EXPECTED_CANDIDATE: ${{ github.event.inputs.candidate_commit }}
          EXPECTED_GENERATOR_HOST: ${{ env.G6_EXPECTED_GENERATOR_HOST }}
          EXPECTED_PREREGISTRATION_SHA256: ${{ github.event.inputs.g6_preregistration_sha256 }}
        run: |
          set +e
          bun tools/load/g6-evaluate.ts \
            --artifact "$G6_BUNDLE_DIR/bench-g6.json" \
            --preflight-down "$G6_BUNDLE_DIR/inputs/preflight-down.json" \
            --preflight-up "$G6_BUNDLE_DIR/inputs/preflight-up.json" \
            --floor "$G6_BUNDLE_DIR/inputs/floor.log" \
            --sink "$G6_BUNDLE_DIR/inputs/sink.json" \
            --expected-candidate "$EXPECTED_CANDIDATE" \
            --expected-generator-host "$EXPECTED_GENERATOR_HOST" \
            --expected-preregistration-sha256 "$EXPECTED_PREREGISTRATION_SHA256" \
            --out "$G6_BUNDLE_DIR/classified.json"
          STATUS="$?"
          echo "G6_EVALUATOR_EXIT=$STATUS" >> "$GITHUB_ENV"
          exit "$STATUS"
      - name: Upload legacy benchmark artifacts
        if: ${{ always() && github.event.inputs.probe_only != 'true' && (github.event.inputs.mode == 'bandwidth' || github.event.inputs.mode == 'session-scale') }}
        with:
          name: bench-bandwidth-${{ github.event.inputs.candidate_commit }}
          path: |
            .bench-evidence/bench-bandwidth-*
            .bench-evidence/bench-session-scale-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      - name: Finalize successor evidence bundle
        id: finalize_g6_bundle
        if: ${{ always() && github.event.inputs.probe_only != 'true' && (github.event.inputs.mode == 'g6-mmo' || github.event.inputs.mode == 'g6-attribution') && env.G6_BUNDLE_DIR != '' }}
        continue-on-error: true
        env:
          MODE: ${{ github.event.inputs.mode }}
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_commit }}
          PREREGISTRATION_SHA256: ${{ github.event.inputs.g6_preregistration_sha256 }}
        run: |
          set +e
          KIND="attribution"
          if [ "$MODE" = "g6-mmo" ]; then KIND="full-g6"; fi
          REASON=""
          if [ "$G6_RUN_EXIT" != "0" ] && [ "$G6_RUN_EXIT" != "not-run" ]; then
            REASON="measurement exit $G6_RUN_EXIT"
          fi
          if [ "$MODE" = "g6-mmo" ] && [ "$G6_EVALUATOR_EXIT" != "0" ] && [ "$G6_EVALUATOR_EXIT" != "not-run" ]; then
            if [ -n "$REASON" ]; then REASON="$REASON; "; fi
            REASON="${REASON}evaluator exit $G6_EVALUATOR_EXIT"
          fi
          FINALIZE_OUT="$RUNNER_TEMP/g6-finalize-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          ARGS=(
            finalize
            --kind "$KIND"
            --dir "$G6_BUNDLE_DIR"
            --candidate "$CANDIDATE_SHA"
            --tree-sha "$G6_TREE_SHA"
            --preregistration "$GITHUB_WORKSPACE/docs/research/preregistrations/gate-g6-mmo-closeout.md"
            --expected-preregistration-sha256 "$PREREGISTRATION_SHA256"
            --registration "$G6_REGISTRATION_PATH"
            --expected-registration-sha256 "$G6_REGISTRATION_SHA256"
            --expected-runner-host "$G6_EXPECTED_RUNNER_HOST"
            --expected-generator-host "$G6_EXPECTED_GENERATOR_HOST"
          )
          if [ -n "$REASON" ]; then
            ARGS+=(--reason "$REASON")
          fi
          bun tools/load/g6-bundle.ts "${ARGS[@]}" > "$FINALIZE_OUT"
          STATUS="$?"
          echo "G6_FINALIZE_EXIT=$STATUS" >> "$GITHUB_ENV"
          if [ "$STATUS" = "0" ]; then
            FINAL_STATUS="$(bun -e 'const path = process.argv[1]; const value = JSON.parse(await Bun.file(path).text()); process.stdout.write(String(value.status ?? ""));' "$FINALIZE_OUT")"
            echo "G6_BUNDLE_STATUS=$FINAL_STATUS" >> "$GITHUB_ENV"
          fi
          exit "$STATUS"
      - name: Verify successor evidence bundle
        id: verify_g6_bundle
        if: ${{ always() && github.event.inputs.probe_only != 'true' && (github.event.inputs.mode == 'g6-mmo' || github.event.inputs.mode == 'g6-attribution') && env.G6_BUNDLE_DIR != '' }}
        continue-on-error: true
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_commit }}
          PREREGISTRATION_SHA256: ${{ github.event.inputs.g6_preregistration_sha256 }}
        run: |
          set +e
          VERIFY_OUT="$RUNNER_TEMP/g6-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          bun tools/load/g6-manifest.ts verify \
            --dir "$G6_BUNDLE_DIR" \
            --expected-candidate "$CANDIDATE_SHA" \
            --expected-preregistration-sha256 "$PREREGISTRATION_SHA256" \
            --expected-registration-sha256 "$G6_REGISTRATION_SHA256" \
            > "$VERIFY_OUT"
          STATUS="$?"
          echo "G6_VERIFY_EXIT=$STATUS" >> "$GITHUB_ENV"
          if [ "$STATUS" = "0" ]; then
            VERIFY_STATUS="$(bun -e 'const path = process.argv[1]; const value = JSON.parse(await Bun.file(path).text()); process.stdout.write(String(value.status ?? ""));' "$VERIFY_OUT")"
            echo "G6_BUNDLE_STATUS=$VERIFY_STATUS" >> "$GITHUB_ENV"
          fi
          exit "$STATUS"
      - name: Upload successor evidence bundle
        id: upload_g6_bundle
        if: ${{ always() && github.event.inputs.probe_only != 'true' && (github.event.inputs.mode == 'g6-mmo' || github.event.inputs.mode == 'g6-attribution' || github.event.inputs.mode == 'ack-reflector-gate') && env.G6_BUNDLE_DIR != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g6-evidence-${{ github.event.inputs.mode }}-${{ github.event.inputs.candidate_commit }}
          path: ${{ env.G6_BUNDLE_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Record successor evidence upload outcome
        if: ${{ always() && github.event.inputs.probe_only != 'true' && (github.event.inputs.mode == 'g6-mmo' || github.event.inputs.mode == 'g6-attribution') }}
        run: |
          if [ "${{ steps.upload_g6_bundle.outcome }}" = "success" ]; then
            echo "G6_UPLOAD_FAILED=false" >> "$GITHUB_ENV"
          else
            echo "G6_UPLOAD_FAILED=true" >> "$GITHUB_ENV"
          fi
      - name: Enforce successor evidence bundle
        if: ${{ always() && github.event.inputs.probe_only != 'true' && (github.event.inputs.mode == 'g6-mmo' || github.event.inputs.mode == 'g6-attribution') }}
        run: |
          FAIL=0
          if [ "$G6_RUN_EXIT" != "0" ]; then
            echo "::error::G6 measurement failed with exit $G6_RUN_EXIT"
            FAIL=1
          fi
          if [ "${{ github.event.inputs.mode }}" = "g6-mmo" ] && [ "$G6_EVALUATOR_EXIT" != "0" ]; then
            echo "::error::G6 evaluator failed with exit $G6_EVALUATOR_EXIT"
            FAIL=1
          fi
          if [ "${{ steps.finalize_g6_bundle.outcome }}" != "success" ] || [ "$G6_FINALIZE_EXIT" != "0" ]; then
            echo "::error::G6 finalization failed with exit $G6_FINALIZE_EXIT"
            FAIL=1
          fi
          if [ "${{ steps.verify_g6_bundle.outcome }}" != "success" ] || [ "$G6_VERIFY_EXIT" != "0" ]; then
            echo "::error::G6 verification failed with exit $G6_VERIFY_EXIT"
            FAIL=1
          fi
          if [ "${{ steps.upload_g6_bundle.outcome }}" != "success" ] || [ "$G6_UPLOAD_FAILED" = "true" ]; then
            echo "::error::G6 bundle upload failed"
            FAIL=1
          fi
          if [ "$G6_BUNDLE_STATUS" != "COMPLETE" ]; then
            echo "::error::G6 verified status was $G6_BUNDLE_STATUS, expected COMPLETE"
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
      - name: Enforce ack reflector kill gate
        if: ${{ always() && github.event.inputs.probe_only != 'true' && github.event.inputs.mode == 'ack-reflector-gate' }}
        run: |
          FAIL=0
          if [ "$G6_RUN_EXIT" != "0" ]; then
            echo "::error::ack reflector kill gate exited $G6_RUN_EXIT (3=fail, 2=unusable)"
            FAIL=1
          fi
          if [ "${{ steps.upload_g6_bundle.outcome }}" != "success" ]; then
            echo "::error::ack reflector evidence upload failed"
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
