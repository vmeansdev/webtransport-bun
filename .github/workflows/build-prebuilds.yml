# Native addon prebuilds for every release target, shared by release.yml and
# channels.yml so a channel build ships exactly what a release build would.
name: build-prebuilds
on:
  workflow_call:
    inputs:
      ref:
        description: "Exact commit SHA to build"
        required: true
        type: string

permissions: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            rust_target: ""
          - os: macos-latest
            target: darwin-arm64
            rust_target: ""
          - os: macos-latest
            target: darwin-x64
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            target: win32-x64-msvc
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action resolved 2026-07-21
        with:
          toolchain: 1.95.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Build native addon (${{ matrix.target }})
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          if [ -n "$RUST_TARGET" ]; then
            rustup target add "$RUST_TARGET"
            bunx @napi-rs/cli@3.3.0 build --cwd crates/native --platform --release --target "$RUST_TARGET"
          else
            bun run build:native
          fi
      - name: Prebuild + checksums
        run: |
          cd packages/webtransport && bun run prebuild:native
          cd ../..
          bun scripts/write-sha256sums.ts packages/webtransport/prebuilds
      - name: Upload prebuilds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 resolved 2026-07-22
        with:
          name: prebuilds-${{ matrix.target }}
          path: packages/webtransport/prebuilds/*
          if-no-files-found: error
          retention-days: 30
