name: supply-chain
# CI producer for the supply-chain-provenance release claim. Dispatch it on the
# release tag (e.g. `gh workflow run supply-chain.yml --ref v1.0.0-rc.1`) after
# publish.yml has published that tag's version: it installs exactly that
# version from the npm registry into an empty project and records
# `npm audit signatures` (registry signatures + provenance attestations) with
# scripts/record-command.ts. Attach the artifact to the candidate pre-release
# with `release-evidence.ts fetch --run <id> --artifact release-evidence-supply-chain`.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-signatures:
    name: Record npm audit signatures for the published version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 resolved 2026-07-22
        with:
          node-version: "22.23.1"
          registry-url: "https://registry.npmjs.org"
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Resolve the published version from the tag
        id: version
        run: |
          set -euo pipefail
          VERSION="$(bun scripts/stamp-version-from-tag.ts "$GITHUB_REF_NAME" --check)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install the published version and audit its signatures
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/audit-project"
          mkdir -p "$PROJECT"
          cd "$PROJECT"
          npm init -y >/dev/null
          bun "$GITHUB_WORKSPACE/scripts/record-command.ts" --out "$RUNNER_TEMP/release-evidence" \
            --name npm-install-published -- \
            npm install --ignore-scripts --save-exact "@webtransport-bun/webtransport@$VERSION"
          bun "$GITHUB_WORKSPACE/scripts/record-command.ts" --out "$RUNNER_TEMP/release-evidence" \
            --name npm-audit-signatures -- \
            npm audit signatures
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 resolved 2026-07-22
        with:
          name: release-evidence-supply-chain
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: warn
          retention-days: 90
