[package]
name = "reference"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "reference-server"
path = "src/main.rs"

[[bin]]
name = "load-client"
path = "src/load_client.rs"

[[bin]]
name = "smoke-client"
path = "src/smoke_client.rs"

[[bin]]
name = "gso-probe"
path = "src/gso_probe.rs"

[[bin]]
name = "rooms-client"
path = "src/rooms_client.rs"

[dependencies]
wtransport = { workspace = true }
quinn-udp = "0.5"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
