[package]
name = "native"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = []
webtransport_test_seams = []

[dependencies]
bytes = "1"
dashmap = "6"
napi = { version = "2", features = ["async", "tokio_rt"] }
napi-derive = "2"
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "io-util"] }
wtransport = { workspace = true }
once_cell = "1"
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
base64 = "0.22"
# SO_REUSEPORT on the server bind socket (the `reusePort` option). The "all"
# feature gates set_reuse_port; the version matches what wtransport already
# locks so there is one socket2 in the tree.
socket2 = { version = "0.6.5", features = ["all"] }
# QUIC-LB connection IDs implement quinn's `ConnectionIdGenerator`, whose error
# type `InvalidCid` quinn does not re-export. Pinned to the exact version quinn
# 0.11 locks: a second quinn-proto in the tree would make the trait we implement
# a different trait than `EndpointConfig::cid_generator` accepts.
quinn-proto = { version = "=0.11.16", default-features = false }
idna = "1"
x509-parser = "0.18.1"
# Global allocator for this dylib's Rust allocations. The macOS system malloc
# never returns freed small-zone pages to the OS (malloc_zone_pressure_relief
# is a measured no-op on macOS 26), which left load-proportional RSS resident
# after fully drained closes. mimalloc purges freed pages back to the OS.
mimalloc = { version = "0.1", default-features = false }

[build-dependencies]
napi-build = "2"
