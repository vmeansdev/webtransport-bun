[package]
name = "compare-supervisor"
version = "0.1.0"
edition = "2021"
publish = false
description = "Comparison-campaign supervisor and its secure filesystem boundary (tools/compare). Not part of the published addon."

# The binaries and every integration test under tests/ compile
# `src/secure_fs.rs` in through a `#[path]` module. The library target exists so
# that file is also built once as a crate of its own, where dead-code analysis
# runs fully (the `#[path]` inclusions necessarily leave most of it unused).
[lib]
name = "compare_supervisor"
path = "src/secure_fs.rs"

# The two binaries the comparison campaign ships.
[[bin]]
name = "comparison-supervisor"
path = "src/bin/comparison-supervisor.rs"

[[bin]]
name = "observe-directory-identity"
path = "src/bin/observe-directory-identity.rs"

[features]
# Exposes the scripted-syscall test seam (`secure_fs::test_support`) outside
# `cfg(test)`.
webtransport_test_seams = []

[dependencies]
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
# Cross-supervisor Ed25519 (RFC 8032) for Mac/rig receipt authentication.
# pkcs8 so comparison-supervisor keygen-ed25519 writes interchangeable .pk8
# private keys; public leaves remain raw 32-byte verifying keys.
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# Handle-relative syscalls of the secure filesystem boundary, macOS and Linux.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
