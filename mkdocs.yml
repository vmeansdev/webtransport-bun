site_name: webtransport-bun
site_description: Production-focused WebTransport for Bun
site_url: https://vmeansdev.github.io/webtransport-bun/
repo_url: https://github.com/vmeansdev/webtransport-bun
repo_name: vmeansdev/webtransport-bun

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start Here: START_HERE.md
  - Getting Started: GETTING_STARTED.md
  - Migration From WebSocket: MIGRATION_WEBSOCKET.md
  - FAQ / Troubleshooting: FAQ.md
  - API Spec: SPEC.md
  - Architecture: ARCHITECTURE.md
  - Operations: OPERATIONS.md
  - Capacity: CAPACITY.md
  - Scenario guides:
      - Overview: scenarios/README.md
      - Realtime games and telemetry: scenarios/realtime-games.md
      - Live media and rooms: scenarios/live-media-rooms.md
      - Bulk transfer and streaming: scenarios/bulk-and-streaming.md
      - Broadcast: scenarios/broadcast.md
      - Connection churn: scenarios/connection-churn.md
      - RPC and tunnels: scenarios/rpc-and-tunnels.md
      - Deployment and scale-out: scenarios/deployment.md
  - Routing by connection ID: quic-lb.md
  - Native stream sink (RFC): RFC_STREAM_SINK.md
  - Metrics: METRICS.md
  - Test Plan: TESTPLAN.md
  - CI / Release: CI.md
  - Compatibility: COMPATIBILITY.md
  - Parity Matrix: PARITY_MATRIX.md
  - Benchmark Baselines: BENCHMARK_BASELINES.md
  - Branches, channels and tags: BRANCHING.md
  - Release checklist: RELEASE_CHECKLIST.md
  - Release status: RELEASE_1.0_STATUS.md
  - wtransport fork maintenance: FORK_MAINTENANCE.md
  - WASM protocol scope: WASM_PROTOCOL_SCOPE.md
