[workspace]
members = [
  "crates/native",
  "crates/reference",
  "crates/adversary",
]
resolver = "2"

[workspace.dependencies]
# Fork of BiagioFesta/wtransport carrying 0-RTT support (branch feat/0rtt),
# pinned by rev. See docs/FORK_MAINTENANCE.md for the maintenance obligations
# this git dependency creates (advisory watch, Dependabot blindness, rev
# reachability).
wtransport = { git = "https://github.com/vmeansdev/wtransport", rev = "aa45f3719bfb5e443d274c2f3c7784797ac81f52", features = ["dangerous-configuration", "quinn"] }
